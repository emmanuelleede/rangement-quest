    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #090c10;
      color: #f8fafc;
      margin: 0;
    }

    @keyframes petBreathe {
      0%, 100% { transform: scale(1) translateY(0px); }
      50% { transform: scale(1.035) translateY(-5px); }
    }

    .anim-breathe {
      animation: petBreathe 3.2s ease-in-out infinite;
    }

    @keyframes petTiredBreathe {
      0%, 100% { transform: scale(0.98) translateY(2px); filter: saturate(0.75) brightness(0.9); }
      50% { transform: scale(1.0) translateY(4px); filter: saturate(0.75) brightness(0.9); }
    }

    .anim-tired {
      animation: petTiredBreathe 4.4s ease-in-out infinite;
    }

    @keyframes petBounce {
      0% { transform: scale(1) translateY(0px) rotate(0deg); }
      30% { transform: scale(1.08) translateY(-12px) rotate(-2.5deg); }
      65% { transform: scale(0.97) translateY(-3px) rotate(2deg); }
      100% { transform: scale(1) translateY(0px) rotate(0deg); }
    }

    .anim-bounce {
      animation: petBounce 0.52s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes sparkleFloat {
      0%, 100% { opacity: 0.25; transform: translateY(0px) scale(0.85); }
      50% { opacity: 0.95; transform: translateY(-9px) scale(1.15); }
    }

    .sparkle-dot {
      animation: sparkleFloat 2.8s ease-in-out infinite;
    }

    @keyframes floatUpFade {
      0% { opacity: 1; transform: translate(-50%, 0px) scale(0.85); }
      100% { opacity: 0; transform: translate(-50%, -48px) scale(1.25); }
    }

    .floating-particle {
      animation: floatUpFade 0.95s ease-out forwards;
      pointer-events: none;
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #0d1117; }
    ::-webkit-scrollbar-thumb { background: #232d3f; border-radius: 4px; }
  </style>
</head>

    let soundEnabled = true;
    let audioCtx = null;

    function getAudioContext() {
      try {
        if (!audioCtx && (window.AudioContext || window.webkitAudioContext)) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          audioCtx = new Ctx();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume().catch(() => {});
        }
        return audioCtx;
      } catch (e) {
        return null;
      }
    }

    function playTone(freq, duration = 0.12, type = 'sine', gainVal = 0.08, delay = 0) {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime + delay);
        gain.gain.setValueAtTime(gainVal, ctx.currentTime + delay);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime + delay);
        osc.stop(ctx.currentTime + delay + duration);
      } catch (e) {}
    }

    function updateSoundIcon() {
      const onIcon = document.getElementById('icon-sound-on');
      const offIcon = document.getElementById('icon-sound-off');
      if (!onIcon || !offIcon) return;
      if (soundEnabled) {
        onIcon.classList.remove('hidden');
        offIcon.classList.add('hidden');
      } else {
        onIcon.classList.add('hidden');
        offIcon.classList.remove('hidden');
      }
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      updateSoundIcon();
      if (soundEnabled) sfxClick();

    // =========================================================================
    // 3. ÉTAT & SAUVEGARDE LOCALE
    // =========================================================================
    const STORAGE_KEY = 'rangement_quest_complete_v1';

    let challengeTimerInterval = null;

    function getDefaultState() {

        adopted: false,

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return getDefaultState();
        const parsed = JSON.parse(raw);
        return {
          ...getDefaultState(),
          ...parsed,
          equippedAccessories: {
            ...getDefaultState().equippedAccessories,
            ...(parsed.equippedAccessories || {})
          }
        };
      } catch (e) {
        return getDefaultState();
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));

    let state = loadState();

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const palette = {
        success: 'bg-emerald-950/95 border-emerald-500/40 text-emerald-200',
        warning: 'bg-amber-950/95 border-amber-500/40 text-amber-200',
        info: 'bg-[#1b2434]/95 border-blue-500/40 text-slate-100'

      el.className = `px-3.5 py-2.5 rounded-2xl border text-xs font-semibold shadow-xl backdrop-blur-md transition-all ${palette[type] || palette.info}`;

      container.appendChild(el);

    // =========================================================================
    // 4. PROGRESSION, STADES & AFFICHAGE VISUEL DES COMPAGNONS
    // =========================================================================
    function getStageIndexFromXp(xp) {
      let idx = 0;
      for (let i = 0; i < EVOLUTION_STAGES.length; i++) {
        if (xp >= EVOLUTION_STAGES[i].minXp) {
          idx = i;
        }
      }
      return idx;
    }

    function getStageInfoFromXp(xp) {
      const idx = getStageIndexFromXp(xp);
      const current = EVOLUTION_STAGES[idx] || EVOLUTION_STAGES[0];
      const next = EVOLUTION_STAGES[idx + 1] || null;
      let progressPct = 100;
      if (next) {
        const span = Math.max(1, next.minXp - current.minXp);
        progressPct = Math.max(0, Math.min(100, Math.round(((xp - current.minXp) / span) * 100)));
      }
      return {
        index: idx,
        current,
        next,
        progressPct,
        isMax: !next
      };
    }

    window.handlePetImageError = function (imgEl) {
      try {
        const raw = imgEl.getAttribute('data-candidates');
        const idx = parseInt(imgEl.getAttribute('data-idx') || '0', 10);
        const list = raw ? JSON.parse(decodeURIComponent(raw)) : [];
        if (idx + 1 < list.length) {
          imgEl.setAttribute('data-idx', String(idx + 1));
          imgEl.src = list[idx + 1];
          return;
        }
      } catch (e) {}

      imgEl.classList.add('hidden');
      const fallback = imgEl.parentElement && imgEl.parentElement.querySelector('.pet-emoji-fallback');
      if (fallback) {
        fallback.classList.remove('hidden');
        fallback.classList.add('flex');
      }
    };

    window.cleanCheckerboardBackground = function (imgEl) {
      try {
        if (!imgEl || imgEl.dataset.cleaned === '1') return;
        const w = imgEl.naturalWidth;
        const h = imgEl.naturalHeight;
        if (!w || !h || w > 1400 || h > 1400) return;

        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        if (!ctx) return;

        ctx.drawImage(imgEl, 0, 0);
        const imgData = ctx.getImageData(0, 0, w, h);
        const data = imgData.data;

        const isCheckerPixel = (pxIdx) => {
          const r = data[pxIdx];
          const g = data[pxIdx + 1];
          const b = data[pxIdx + 2];
          const a = data[pxIdx + 3];
          if (a === 0) return true;
          const maxDiff = Math.max(Math.abs(r - g), Math.abs(g - b), Math.abs(r - b));
          if (maxDiff > 18) return false;
          const isLightSquare = r >= 195 && g >= 195 && b >= 195;
          const isGreySquare = r >= 120 && r <= 194 && g >= 120 && g <= 194 && b >= 120 && b <= 194;
          return isLightSquare || isGreySquare;
        };

        const totalPixels = w * h;
        const visited = new Uint8Array(totalPixels);
        const queue = [];

        const pushIfChecker = (x, y) => {
          if (x < 0 || y < 0 || x >= w || y >= h) return;
          const pIdx = y * w + x;
          if (visited[pIdx]) return;
          const dIdx = pIdx * 4;
          if (isCheckerPixel(dIdx)) {
            visited[pIdx] = 1;
            queue.push(pIdx);
          }
        };

        for (let x = 0; x < w; x++) {
          pushIfChecker(x, 0);
          pushIfChecker(x, h - 1);
        }
        for (let y = 0; y < h; y++) {
          pushIfChecker(0, y);
          pushIfChecker(w - 1, y);
        }

        let head = 0;
        while (head < queue.length) {
          const pIdx = queue[head++];
          const x = pIdx % w;
          const y = (pIdx - x) / w;
          pushIfChecker(x + 1, y);
          pushIfChecker(x - 1, y);
          pushIfChecker(x, y + 1);
          pushIfChecker(x, y - 1);
        }

        let removedCount = 0;
        for (let pIdx = 0; pIdx < totalPixels; pIdx++) {
          if (visited[pIdx]) {
            data[pIdx * 4 + 3] = 0;
            removedCount++;
          }
        }

        imgEl.dataset.cleaned = '1';
        if (removedCount > 0) {
          ctx.putImageData(imgData, 0, 0);
          imgEl.src = canvas.toDataURL('image/png');
        }
      } catch (e) {
        imgEl.dataset.cleaned = '1';
      }
    };

                type="button"
                onclick="incrementChallengeCount()"
                class="w-full py-4 rounded-2xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold text-sm shadow-lg transition"
              >
                +1 Objet rangé
              </button>
            </div>
            <button
              type="button"
              onclick="cancelActiveChallenge()"
              class="w-full py-2.5 rounded-2xl bg-[#1e2634] text-slate-300 text-xs font-semibold"
            >
              Annuler le défi
            </button>
          </div>
        `;
      } else if (activeChallenge.type === 'race10') {
        main.innerHTML = `
          <div class="p-4 space-y-5 flex-1 flex flex-col justify-between">
            <div class="rounded-3xl bg-[#151b26] border border-blue-500/30 p-5 text-center space-y-3">
              <div class="text-xs font-bold uppercase text-blue-300">Course aux 10 objets</div>
              <div id="challenge-timer" class="text-4xl font-extrabold text-white">${activeChallenge.elapsed}s</div>
              <p class="text-xs text-slate-400">Atteins 10 objets rangés le plus vite possible.</p>
              <div id="challenge-counter" class="text-5xl font-extrabold text-blue-300 py-2">${activeChallenge.count} / 10</div>
              <button
                type="button"
                onclick="incrementChallengeCount()"
                class="w-full py-4 rounded-2xl bg-blue-500 hover:bg-blue-400 text-white font-extrabold text-sm shadow-lg transition"
              >
                +1 Objet rangé
              </button>
            </div>
            <button
              type="button"
              onclick="cancelActiveChallenge()"
              class="w-full py-2.5 rounded-2xl bg-[#1e2634] text-slate-300 text-xs font-semibold"
            >
              Annuler la course
            </button>
          </div>
        `;
      } else {
        main.innerHTML = `
          <div class="p-4 space-y-5 flex-1 flex flex-col justify-between">
            <div class="rounded-3xl bg-[#151b26] border border-purple-500/30 p-5 space-y-3">
              <div class="text-xs font-bold uppercase text-purple-300">Mission contrainte</div>
              <h3 class="text-lg font-extrabold text-white">${activeChallenge.title}</h3>
              <p class="text-xs text-slate-300 leading-relaxed">${activeChallenge.desc}</p>
              <div class="pt-2 flex items-center justify-between text-xs font-bold text-amber-300">
                <span>Récompense : +${activeChallenge.rewardCoins} 🪙 · +${activeChallenge.rewardXp} XP</span>
              </div>
              <button
                type="button"
                onclick="completeConstraintChallenge()"
                class="w-full mt-3 py-3.5 rounded-2xl bg-purple-500 hover:bg-purple-400 text-white font-bold text-sm transition"
              >
                Mission accomplie !
              </button>
            </div>
            <button
              type="button"
              onclick="cancelActiveChallenge()"
              class="w-full py-2.5 rounded-2xl bg-[#1e2634] text-slate-300 text-xs font-semibold"
            >
              Annuler la mission
            </button>
          </div>
        `;
      }
    }

    function startSprint30() {
      clearChallengeTimer();
      sfxClick();
      activeChallenge = { type: 'sprint30', timeLeft: 30, count: 0 };
      renderChallenges();
      challengeTimerInterval = setInterval(() => {
        if (!activeChallenge || activeChallenge.type !== 'sprint30') return;
        activeChallenge.timeLeft -= 1;
        const timerEl = document.getElementById('challenge-timer');
        if (timerEl) timerEl.textContent = `${Math.max(0, activeChallenge.timeLeft)}s`;
        if (activeChallenge.timeLeft <= 0) {
          finishSprint30();
        } else if (activeChallenge.timeLeft <= 5) {
          sfxTick();
        }
      }, 1000);
    }

    function finishSprint30() {
      clearChallengeTimer();
      const count = activeChallenge ? activeChallenge.count : 0;
      activeChallenge = null;
      if (count > state.bestSprint30) {
        state.bestSprint30 = count;
      }
      state.totalChallenges += 1;
      const coinsEarned = Math.max(10, count * 3);
      const xpEarned = Math.max(15, count * 4);
      awardRewards(xpEarned, coinsEarned, -5, `Sprint (${count} objets)`);
      renderChallenges();
    }

    function startRace10() {
      clearChallengeTimer();
      sfxClick();
      activeChallenge = { type: 'race10', elapsed: 0, count: 0 };
      renderChallenges();
      challengeTimerInterval = setInterval(() => {
        if (!activeChallenge || activeChallenge.type !== 'race10') return;
        activeChallenge.elapsed += 1;
        const timerEl = document.getElementById('challenge-timer');
        if (timerEl) timerEl.textContent = `${activeChallenge.elapsed}s`;
      }, 1000);
    }

    function startConstraintChallenge() {
      clearChallengeTimer();
      sfxClick();
      const pick = CONSTRAINT_CHALLENGES[Math.floor(Math.random() * CONSTRAINT_CHALLENGES.length)];
      activeChallenge = { type: 'constraint', ...pick };
      renderChallenges();
    }

    function incrementChallengeCount() {
      if (!activeChallenge) return;
      sfxTick();
      activeChallenge.count += 1;
      if (activeChallenge.type === 'sprint30') {
        const counterEl = document.getElementById('challenge-counter');
        if (counterEl) counterEl.textContent = String(activeChallenge.count);
      } else if (activeChallenge.type === 'race10') {
        const counterEl = document.getElementById('challenge-counter');
        if (counterEl) counterEl.textContent = `${Math.min(10, activeChallenge.count)} / 10`;
        if (activeChallenge.count >= 10) {
          clearChallengeTimer();
          const timeTaken = activeChallenge.elapsed;
          activeChallenge = null;
          if (state.bestRace10 === null || timeTaken < state.bestRace10) {
            state.bestRace10 = timeTaken;
          }
          state.totalChallenges += 1;
          awardRewards(35, 30, -5, `Course 10 objets en ${timeTaken}s`);
          renderChallenges();
        }
      }
    }

    function completeConstraintChallenge() {
      if (!activeChallenge) return;
      const { rewardCoins, rewardXp, title } = activeChallenge;
      activeChallenge = null;
      state.totalChallenges += 1;
      awardRewards(rewardXp, rewardCoins, -5, title);
      renderChallenges();
    }

    function cancelActiveChallenge() {
      clearChallengeTimer();
      activeChallenge = null;
      sfxClick();
      renderChallenges();
    }

    // =========================================================================
    // 8. ONGLET BOUTIQUE
    // =========================================================================
    function renderShop() {
      const nav = document.getElementById('bottom-nav');
      const sub = document.getElementById('header-subtitle');
      if (nav) nav.classList.remove('hidden');
      if (sub) sub.textContent = 'Boutique du compagnon';

      const main = document.getElementById('main-content');
      if (!main) return;

      const tabs = [
        { id: 'accessory', label: 'Accessoires' },
        { id: 'habitat', label: 'Lieux' },
        { id: 'care', label: 'Friandises' }
      ];

      const items = SHOP_ITEMS.filter((i) => i.category === shopCategory);

      main.innerHTML = `
        <div class="p-4 space-y-4">
          <div class="flex items-center justify-between">
            <div>
              <h2 class="text-base font-extrabold text-white">Boutique</h2>
              <p class="text-xs text-slate-400">Personnalise ${state.petName} et son décor.</p>
            </div>
            <span class="px-3 py-1 rounded-xl bg-amber-500/15 border border-amber-400/30 text-xs font-bold text-amber-300">
              🪙 ${state.coins} pièces
            </span>
          </div>

          <div class="grid grid-cols-3 gap-2">
            ${tabs.map((t) => {
              const active = t.id === shopCategory;
              return `
                <button
                  type="button"
                  onclick="setShopCategory('${t.id}')"
                  class="py-2 px-2 rounded-2xl text-xs font-bold border transition ${
                    active
                      ? 'bg-blue-500/20 border-blue-400 text-blue-200'
                      : 'bg-[#151b26] border-[#232d3f] text-slate-400 hover:text-slate-200'
                  }"
                >
                  ${t.label}
                </button>
              `;
            }).join('')}
          </div>

          <div class="space-y-2.5">
            ${items.map((item) => {
              const isOwned = item.category === 'care' ? false : state.ownedItems.includes(item.id);
              const isEquipped = item.category === 'habitat'
                ? state.equippedHabitat === item.id
                : (item.category === 'accessory' ? state.equippedAccessories[item.slot] === item.id : false);

              let actionBtn = '';
              if (item.category === 'care') {
                actionBtn = `
                  <button
                    type="button"
                    onclick="buyOrUseItem('${item.id}')"
                    class="px-3 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-bold transition"
                  >
                    Donner · ${item.price} 🪙
                  </button>
                `;
              } else if (isEquipped) {
                actionBtn = `
                  <button
                    type="button"
                    onclick="toggleEquipItem('${item.id}')"
                    class="px-3 py-2 rounded-xl bg-emerald-500/20 border border-emerald-400/40 text-emerald-200 text-xs font-bold transition"
                  >
                    Équipé ✓
                  </button>
                `;
              } else if (isOwned) {
                actionBtn = `
                  <button
                    type="button"
                    onclick="toggleEquipItem('${item.id}')"
                    class="px-3 py-2 rounded-xl bg-blue-500 hover:bg-blue-400 text-white text-xs font-bold transition"
                  >
                    Équiper
                  </button>
                `;
              } else {
                actionBtn = `
                  <button
                    type="button"
                    onclick="buyOrUseItem('${item.id}')"
                    class="px-3 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-bold transition"
                  >
                    ${item.price} 🪙
                  </button>
                `;
              }

              return `
                <div class="rounded-2xl bg-[#151b26] border border-[#232d3f] p-3.5 flex items-center justify-between gap-3">
                  <div class="flex items-center gap-3">
                    <div class="w-11 h-11 rounded-2xl bg-[#0d1117] border border-[#232d3f] flex items-center justify-center text-2xl">
                      ${item.icon}
                    </div>
                    <div>
                      <div class="text-xs font-bold text-white">${item.name}</div>
                      <div class="text-[11px] text-slate-400">${item.desc}</div>
                    </div>
                  </div>
                  ${actionBtn}
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function setShopCategory(cat) {
      sfxClick();
      shopCategory = cat;
      renderShop();
    }

    function buyOrUseItem(itemId) {
      const item = SHOP_ITEMS.find((i) => i.id === itemId);
      if (!item) return;
      if (state.coins < item.price) {
        showToast('Pas assez de pièces !', 'warning');
        return;
      }

      state.coins -= item.price;

      if (item.category === 'care') {
        const xpBonus = item.effectType === 'feast' ? 30 : 10;
        awardRewards(xpBonus, 0, item.effectValue, item.name);
        renderShop();
        return;
      }

      if (!state.ownedItems.includes(item.id)) {
        state.ownedItems.push(item.id);
      }

      if (item.category === 'habitat') {
        state.equippedHabitat = item.id;
      } else if (item.category === 'accessory') {
        state.equippedAccessories[item.slot] = item.id;
      }

      saveState();
      sfxCoin();
      showToast(`${item.name} débloqué et équipé !`, 'success');
      renderShop();
    }

    function toggleEquipItem(itemId) {
      const item = SHOP_ITEMS.find((i) => i.id === itemId);
      if (!item) return;
      sfxClick();

      if (item.category === 'habitat') {
        state.equippedHabitat = item.id;
        showToast(`${item.name} activé`, 'info');
      } else if (item.category === 'accessory') {
        if (state.equippedAccessories[item.slot] === item.id) {
          state.equippedAccessories[item.slot] = null;
          showToast(`${item.name} retiré`, 'info');
        } else {
          state.equippedAccessories[item.slot] = item.id;
          showToast(`${item.name} équipé`, 'success');
        }
      }

      saveState();
      renderShop();
    }

    // =========================================================================
    // 9. MENU DÉMO & RÉINITIALISATION
    // =========================================================================
    function openModal(htmlContent) {
      const overlay = document.getElementById('modal-overlay');
      const box = document.getElementById('modal-box');
      if (!overlay || !box) return;
      box.innerHTML = htmlContent;
      overlay.classList.remove('hidden');
      overlay.classList.add('flex');
    }

    function closeModal() {
      const overlay = document.getElementById('modal-overlay');
      if (!overlay) return;
      overlay.classList.add('hidden');
      overlay.classList.remove('flex');
    }

    function openDemoModal() {
      sfxClick();
      openModal(`
        <div class="flex items-center justify-between">
          <h3 class="text-sm font-extrabold text-white">Outils de test (Démo)</h3>
          <button type="button" onclick="closeModal()" class="text-slate-400 hover:text-white text-sm">✕</button>
        </div>
        <p class="text-xs text-slate-400">
          Teste rapidement l’évolution des 4 stades, les pièces ou la réinitialisation complète.
        </p>
        <div class="grid grid-cols-2 gap-2">
          <button
            type="button"
            onclick="demoAddCoins(100)"
            class="py-2.5 px-3 rounded-2xl bg-amber-500/20 hover:bg-amber-500/30 border border-amber-400/35 text-xs font-bold text-amber-200"
          >
            +100 Pièces
          </button>
          <button
            type="button"
            onclick="demoAddXp(90)"
            class="py-2.5 px-3 rounded-2xl bg-blue-500/20 hover:bg-blue-500/30 border border-blue-400/35 text-xs font-bold text-blue-200"
          >
            +90 XP (Stade +)
          </button>
        </div>
        <div class="space-y-1.5">
          <div class="text-[11px] font-semibold text-slate-400">Forcer un stade :</div>
          <div class="grid grid-cols-4 gap-1.5">
            ${EVOLUTION_STAGES.map((st, idx) => `
              <button
                type="button"
                onclick="demoSetStage(${idx})"
                class="py-1.5 px-1 rounded-xl bg-[#1e2634] hover:bg-[#2a3548] text-[11px] font-bold text-slate-200 truncate"
              >
                ${st.label}
              </button>
            `).join('')}
          </div>
        </div>
        <div class="pt-2 border-t border-[#232d3f] flex items-center justify-between gap-2">
          <button
            type="button"
            onclick="demoResetAll()"
            class="py-2 px-3 rounded-xl bg-rose-500/15 hover:bg-rose-500/25 border border-rose-500/35 text-xs font-bold text-rose-300"
          >
            Réinitialiser tout
          </button>
          <button
            type="button"
            onclick="closeModal()"
            class="py-2 px-4 rounded-xl bg-blue-500 text-xs font-bold text-white"
          >
            Fermer
          </button>
        </div>
      `);
    }

    function demoAddCoins(amount) {
      awardRewards(0, amount, 0, 'Bonus Démo');
      refreshCurrentView();
    }

    function demoAddXp(amount) {
      if (!state.adopted) {
        state.adopted = true;
      }
      awardRewards(amount, 0, 0, 'Bonus Démo');
      refreshCurrentView();
    }

    function demoSetStage(stageIdx) {
      const target = EVOLUTION_STAGES[stageIdx] || EVOLUTION_STAGES[0];
      if (!state.adopted) {
        state.adopted = true;
      }
      state.xp = target.minXp;
      saveState();
      sfxCoin();
      showToast(`Stade : ${target.label}`, 'info');
      refreshCurrentView();
    }

    function demoResetAll() {
      clearChallengeTimer();
      activeChallenge = null;
      state = getDefaultState();
      saveState();
      closeModal();
      sfxClick();
      showToast('Sauvegarde réinitialisée', 'info');
      render();
    }

    // =========================================================================
    // 10. NAVIGATION & DÉMARRAGE
    // =========================================================================
    function updateNavHighlight() {
      ['sanctuary', 'challenges', 'shop'].forEach((tab) => {
        const btn = document.getElementById(`nav-${tab}`);
        if (!btn) return;
        if (tab === currentTab) {
          btn.classList.remove('text-slate-400');
          btn.classList.add('text-blue-400', 'bg-blue-500/10');
        } else {
          btn.classList.remove('text-blue-400', 'bg-blue-500/10');
          btn.classList.add('text-slate-400');
        }
      });
    }

    function switchTab(tab) {
      clearChallengeTimer();
      activeChallenge = null;
      currentTab = tab;
      sfxClick();
      render();
    }

    function refreshCurrentView() {
      if (!state.adopted) {
        renderOnboarding();
        return;
      }
      if (currentTab === 'challenges') renderChallenges();
      else if (currentTab === 'shop') renderShop();
      else renderSanctuary();
      updateNavHighlight();
    }

    function render() {
      updateSoundIcon();
      refreshCurrentView();
    }

    window.addEventListener('DOMContentLoaded', () => {
      try {
        render();
      } catch (err) {
        const main = document.getElementById('main-content');
        if (main) {
          main.innerHTML = `<div class="p-4 text-xs text-rose-300">Erreur d'affichage : ${err && err.message ? err.message : err}</div>`;
        }
      }
    });
  </script>
</body>
</html>
