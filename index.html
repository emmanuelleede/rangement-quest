    body {
      background-color: #090C10;
      color: #F8FAFC;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
    }

    @keyframes petBreathe {
      0%, 100% { transform: scale(1) translateY(0); }
      50% { transform: scale(1.035) translateY(-4px); }
    }
    .anim-breathe {
      animation: petBreathe 3.2s ease-in-out infinite;
    }

    @keyframes petTiredBreathe {
      0%, 100% { transform: scale(0.98) translateY(2px); filter: saturate(0.75) brightness(0.9); }
      50% { transform: scale(1.00) translateY(4px); filter: saturate(0.75) brightness(0.9); }
    }
    .anim-tired {
      animation: petTiredBreathe 4.5s ease-in-out infinite;
    }

    @keyframes petBounce {
      0%, 100% { transform: scale(1); }
      35% { transform: scale(1.08) translateY(-8px); }
      70% { transform: scale(0.96); }
    }
    .anim-bounce {
      animation: petBounce 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes sparkleFloat {
      0%, 100% { opacity: 0.25; transform: translateY(0) scale(0.8); }
      50% { opacity: 0.95; transform: translateY(-10px) scale(1.15); }
    }
    .sparkle-dot {
      animation: sparkleFloat 2.8s ease-in-out infinite;
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #0D1117; }
    ::-webkit-scrollbar-thumb { background: #232D3F; border-radius: 4px; }
  </style>
</head>

    // =========================================================================
    // 1. MOTEUR SONORE (WEB AUDIO API)
    // =========================================================================
    let soundEnabled = true;
    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx && (window.AudioContext || window.webkitAudioContext)) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        audioCtx = new Ctx();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }

    function playTone(freq, duration = 0.12, type = 'sine', gainVal = 0.08, delay = 0) {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime + delay);
        gain.gain.setValueAtTime(gainVal, ctx.currentTime + delay);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime + delay);
        osc.stop(ctx.currentTime + delay + duration);
      } catch (e) {}
    }

    function updateSoundIcon() {
      const onIcon = document.getElementById('icon-sound-on');
      const offIcon = document.getElementById('icon-sound-off');
      if (!onIcon || !offIcon) return;
      if (soundEnabled) {
        onIcon.classList.remove('hidden');
        offIcon.classList.add('hidden');
      } else {
        onIcon.classList.add('hidden');
        offIcon.classList.remove('hidden');
      }
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      updateSoundIcon();
      if (soundEnabled) sfxClick();
    }

    function sfxClick() { playTone(520, 0.07, 'sine', 0.06); }

      playTone(880, 0.16, 'sine', 0.07, 0.08);

        xp: 0,
        energy: 80,

          neck: null,

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return getDefaultState();
        const parsed = JSON.parse(raw);
        return {
          ...getDefaultState(),
          ...parsed,
          equippedAccessories: {
            ...getDefaultState().equippedAccessories,
            ...(parsed.equippedAccessories || {})
          }
        };
      } catch (e) {
        return getDefaultState();
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));

    function getStageIndexFromXp(xp) {
      let idx = 0;
      for (let i = 0; i < EVOLUTION_STAGES.length; i++) {
        if (xp >= EVOLUTION_STAGES[i].minXp) {
          idx = i;
        }
      }
      return idx;
    }

    function getStageInfoFromXp(xp) {
      const idx = getStageIndexFromXp(xp);
      const current = EVOLUTION_STAGES[idx] || EVOLUTION_STAGES[0];
      const next = EVOLUTION_STAGES[idx + 1] || null;
      return {
        index: idx,
        current,
        next,
        isMax: !next
      };
    }

    function getLocalPetImageCandidates(speciesId, xp = 0) {
      const cfg = SPECIES_VISUAL_CONFIG[speciesId] || SPECIES_VISUAL_CONFIG.loutre;
      const stageIndex = getStageIndexFromXp(xp);
      const candidates = [];

      if (Array.isArray(cfg.localStageImages) && cfg.localStageImages[stageIndex]) {
        candidates.push(cfg.localStageImages[stageIndex]);
      }
      if (Array.isArray(cfg.localStageImages)) {
        cfg.localStageImages.forEach((imgPath) => {
          if (imgPath && !candidates.includes(imgPath)) {
            candidates.push(imgPath);
          }
        });
      }
      if (cfg.localFallback && !candidates.includes(cfg.localFallback)) {
        candidates.push(cfg.localFallback);
      }
      return candidates;
    }

    function renderLocalImageWithFallback(candidates, altText, extraClasses, styleAttr, fallbackHtml) {
      const cleanList = (Array.isArray(candidates) ? candidates : [candidates]).filter(Boolean);
      if (!cleanList.length) {
        return fallbackHtml;
      }
      const encodedList = encodeURIComponent(JSON.stringify(cleanList));
      const firstSrc = cleanList[0];

      return `
        <img
          src="${firstSrc}"
          alt="${altText}"
          data-candidates="${encodedList}"
          data-candidate-index="0"
          class="${extraClasses || ''}"
          style="${styleAttr || ''}"
          onerror="handleLocalImageError(this)"
        />
        <div class="local-img-fallback hidden w-full h-full">${fallbackHtml}</div>
      `;
    }

    window.handleLocalImageError = function (imgEl) {
      try {
        const rawList = imgEl.getAttribute('data-candidates');
        const currentIdx = parseInt(imgEl.getAttribute('data-candidate-index') || '0', 10);
        const candidates = rawList ? JSON.parse(decodeURIComponent(rawList)) : [];
        const nextIdx = currentIdx + 1;

        if (nextIdx < candidates.length) {
          imgEl.setAttribute('data-candidate-index', String(nextIdx));
          imgEl.src = candidates[nextIdx];
          return;
        }
      } catch (e) {}

      imgEl.classList.add('hidden');
      const fallbackEl = imgEl.parentElement && imgEl.parentElement.querySelector('.local-img-fallback');
      if (fallbackEl) {
        fallbackEl.classList.remove('hidden');
      }
    };

      const animClass = eatingItem
        ? 'anim-bounce'
        : (isTired ? 'anim-tired' : 'anim-breathe');

        sm: { box: 'w-20 h-20', img: 'w-20 h-20 object-contain', emoji: 'text-4xl' },
        md: { box: 'w-28 h-28', img: 'w-28 h-28 object-contain', emoji: 'text-5xl' },

      const sz = sizeMap[size] || sizeMap.lg;
      const candidates = getLocalPetImageCandidates(speciesId, xp);

        if (itemId) {
          const item = SHOP_ITEMS.find((i) => i.id === itemId);

            accBadges.push(`<span title="${item.name}" class="px-1.5 py-0.5 rounded-full bg-slate-900/80 border border-white/15 text-xs shadow">${item.icon}</span>`);

        <div class="relative flex flex-col items-center justify-center ${sz.box} ${animClass} select-none">
          <div class="relative z-10 w-full h-full flex items-center justify-center">
            ${renderLocalImageWithFallback(

    function buildHabitatBackdropHTML(habitatId) {
      const hab = HABITAT_THEMES[habitatId] || HABITAT_THEMES.hab_clearing;
      const hasCustomHabitat = state.ownedItems.includes(habitatId) && habitatId !== 'hab_clearing';
      const fallbackBg = `
        <div class="w-full h-full" style="background: ${hab.gradient};"></div>
      `;

      if (!hasCustomHabitat || !hab.localBg) {
        return `<div class="absolute inset-0 overflow-hidden pointer-events-none">${fallbackBg}</div>`;
      }

      return `
        <div class="absolute inset-0 overflow-hidden pointer-events-none">
          ${renderLocalImageWithFallback(
            [hab.localBg],
            hab.name,
            'w-full h-full object-cover opacity-75',
            '',
            fallbackBg
          )}
          <div class="absolute inset-0 bg-gradient-to-t from-[#0D1117] via-[#0D1117]/40 to-transparent"></div>

    // =========================================================================
    // 5. TOASTS & MODALES
    // =========================================================================
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const styles = {
        success: 'bg-emerald-950/95 border-emerald-500/40 text-emerald-200',
        warning: 'bg-amber-950/95 border-amber-500/40 text-amber-200',
        info: 'bg-[#151B26]/95 border-blue-500/40 text-slate-100'
      };
      const el = document.createElement('div');
      el.className = `px-4 py-2.5 rounded-2xl border text-xs font-semibold shadow-xl transition ${styles[type] || styles.info}`;
      el.textContent = message;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(-6px)';
        setTimeout(() => el.remove(), 220);
      }, 2400);
    }

    function openModal(htmlContent) {
      const overlay = document.getElementById('modal-overlay');
      const box = document.getElementById('modal-box');
      if (!overlay || !box) return;
      box.innerHTML = htmlContent;
      overlay.classList.remove('hidden');
      overlay.classList.add('flex');
    }

    function closeModal() {
      const overlay = document.getElementById('modal-overlay');
      if (!overlay) return;
      overlay.classList.add('hidden');
      overlay.classList.remove('flex');
    }

    function openDemoModal() {
      sfxClick();
      openModal(`
        <div class="flex items-center justify-between">
          <h3 class="text-base font-bold text-white">⚙️ Contrôles Démo</h3>
          <button onclick="closeModal()" class="text-slate-400 hover:text-white text-sm">✕</button>
        </div>
        <p class="text-xs text-slate-400">Teste rapidement les pièces, l'évolution et la réinitialisation.</p>
        <div class="grid grid-cols-2 gap-2">
          <button onclick="demoAddCoins(100)" class="py-2.5 px-3 rounded-xl bg-amber-500/15 border border-amber-500/30 text-amber-300 text-xs font-semibold hover:bg-amber-500/25">+100 Pièces</button>
          <button onclick="demoAddXp(80)" class="py-2.5 px-3 rounded-xl bg-blue-500/15 border border-blue-500/30 text-blue-300 text-xs font-semibold hover:bg-blue-500/25">+80 XP (Évolution)</button>
          <button onclick="demoRefillEnergy()" class="py-2.5 px-3 rounded-xl bg-emerald-500/15 border border-emerald-500/30 text-emerald-300 text-xs font-semibold hover:bg-emerald-500/25">Énergie 100%</button>

      state.coins += amount;
      saveState();
      sfxCoin();
      showToast(`+${amount} pièces ajoutées !`, 'success');
      renderApp();
    }

    function demoAddXp(amount) {
      const beforeStage = getStageIndexFromXp(state.xp);
      state.xp += amount;
      const afterStage = getStageIndexFromXp(state.xp);
      saveState();

        sfxVictory();
        showToast(`Stade atteint : ${EVOLUTION_STAGES[afterStage].label} !`, 'success');

        sfxCoin();
        showToast(`+${amount} XP ajoutés !`, 'info');

      state.energy = 100;
      saveState();
      sfxPet();
      showToast('Énergie rechargée à 100% !', 'success');
      renderApp();

    function demoResetAll() {
      stopChallengeTimer();
      activeChallenge = null;

      saveState();
      renderApp();

      state.petName = val;

    }

    function confirmAdoption() {
      const cleanedName = (state.petName || '').trim() || (SPECIES_DATA[state.species]?.defaultPetName || 'Compagnon');

      state.adopted = true;
      saveState();
      sfxVictory();
      showToast(`${cleanedName} est prêt pour l'aventure !`, 'success');
      renderApp();

      sfxClick();
      currentTab = tabName;
      renderApp();

      const nav = document.getElementById('bottom-nav');
      if (!nav) return;
      if (!state.adopted) {
        nav.classList.add('hidden');

      }
      nav.classList.remove('hidden');
      ['sanctuary', 'challenges', 'shop'].forEach((id) => {
        const btn = document.getElementById(`nav-${id}`);

        if (id === currentTab) {
          btn.classList.remove('text-slate-400');
          btn.classList.add('text-blue-400', 'bg-blue-500/10');
        } else {
          btn.classList.remove('text-blue-400', 'bg-blue-500/10');
          btn.classList.add('text-slate-400');

    function petCompanion() {
      const beforeStage = getStageIndexFromXp(state.xp);
      state.xp += 5;
      state.energy = Math.min(100, state.energy + 2);
      const afterStage = getStageIndexFromXp(state.xp);
      saveState();

      if (afterStage > beforeStage) {
        sfxVictory();
        showToast(`${state.petName} passe au stade ${EVOLUTION_STAGES[afterStage].label} !`, 'success');
      } else {
        sfxPet();
        showToast(`${state.petName} ronronne de plaisir (+5 XP) !`, 'info');
      }
      renderApp();
    }

    // =========================================================================
    // 8. ONGLET DÉFIS
    // =========================================================================
    function stopChallengeTimer() {
      if (challengeTimerInterval) {
        clearInterval(challengeTimerInterval);
        challengeTimerInterval = null;
      }
    }

    function renderChallengesTab(container) {
      if (activeChallenge) {
        const mins = Math.floor(activeChallenge.remaining / 60);
        const secs = activeChallenge.remaining % 60;
        const formattedTime = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

        container.innerHTML = `
          <div class="p-5 space-y-5 flex-1 flex flex-col justify-between">
            <div class="space-y-4">
              <div class="p-4 rounded-2xl bg-[#151B26] border border-[#2A3548] space-y-2 text-center">
                <div class="text-xs uppercase tracking-wider text-blue-400 font-bold">Défi en cours</div>
                <h2 class="text-lg font-extrabold text-white">${activeChallenge.title}</h2>
                <p class="text-xs text-slate-300">${activeChallenge.desc}</p>
              </div>

              <div class="py-6 rounded-3xl bg-[#151B26] border border-[#232D3F] flex flex-col items-center justify-center gap-2">
                <div class="text-4xl font-black text-white tabular-nums">${formattedTime}</div>
                <div class="text-xs text-slate-400">Récompense : +${activeChallenge.rewardCoins} pièces • +${activeChallenge.rewardXp} XP</div>
              </div>
            </div>

            <div class="space-y-2.5">
              <button
                type="button"
                onclick="completeActiveChallenge()"
                class="w-full py-3.5 rounded-2xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm shadow-lg transition"
              >
                ✓ Mission terminée !
              </button>
              <button
                type="button"
                onclick="cancelActiveChallenge()"
                class="w-full py-2.5 rounded-2xl bg-[#151B26] hover:bg-[#1E2634] text-slate-400 font-semibold text-xs transition"
              >
                Annuler le défi
              </button>
            </div>
          </div>
        `;
        return;
      }

      const constraintCards = CONSTRAINT_CHALLENGES.map((ch, idx) => `
        <div class="p-3.5 rounded-2xl bg-[#151B26] border border-[#232D3F] flex items-center justify-between gap-3">
          <div class="space-y-0.5">
            <div class="text-xs font-bold text-white">${ch.title}</div>
            <div class="text-[11px] text-slate-400">${ch.desc}</div>
            <div class="text-[11px] text-amber-300 font-semibold pt-0.5">+${ch.rewardCoins} pièces • +${ch.rewardXp} XP</div>
          </div>
          <button
            type="button"
            onclick="startConstraintChallenge(${idx})"
            class="px-3 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold shrink-0 transition"
          >
            Lancer
          </button>
        </div>
      `).join('');

      container.innerHTML = `
        <div class="p-4 space-y-4">
          <div>
            <h2 class="text-lg font-extrabold text-white">Défis de rangement</h2>
            <p class="text-xs text-slate-400">Valide une mission pour gagner des pièces et faire grandir ${state.petName}.</p>
          </div>

          <div class="grid grid-cols-2 gap-2.5">
            <button
              type="button"
              onclick="startTimedChallenge('Sprint 30s', 'Range un maximum d’affaires en 30 secondes.', 30, 20, 25)"
              class="p-3.5 rounded-2xl bg-[#151B26] hover:bg-[#1B2332] border border-[#232D3F] text-left space-y-1 transition"
            >
              <div class="text-xs font-extrabold text-amber-300">⚡ Sprint 30s</div>
              <div class="text-[11px] text-slate-400">Défi éclair de rangement.</div>
              <div class="text-[11px] text-slate-300 font-semibold">+20 pièces • +25 XP</div>
            </button>

            <button
              type="button"
              onclick="startTimedChallenge('Mission 2 min', 'Range une zone complète en 2 minutes.', 120, 40, 45)"
              class="p-3.5 rounded-2xl bg-[#151B26] hover:bg-[#1B2332] border border-[#232D3F] text-left space-y-1 transition"
            >
              <div class="text-xs font-extrabold text-blue-300">⏱️ Mission 2 min</div>
              <div class="text-[11px] text-slate-400">Défi concentré sur une zone.</div>
              <div class="text-[11px] text-slate-300 font-semibold">+40 pièces • +45 XP</div>
            </button>
          </div>

          <div class="space-y-2">
            <div class="text-xs font-bold text-slate-300 uppercase tracking-wider">Missions à contrainte</div>
            ${constraintCards}
          </div>
        </div>
      `;
    }

    function startTimedChallenge(title, desc, durationSec, rewardCoins, rewardXp) {
      sfxClick();
      stopChallengeTimer();
      activeChallenge = {
        title,
        desc,
        remaining: durationSec,
        rewardCoins,
        rewardXp
      };
      challengeTimerInterval = setInterval(() => {
        if (!activeChallenge) {
          stopChallengeTimer();
          return;
        }
        activeChallenge.remaining -= 1;
        if (activeChallenge.remaining <= 0) {
          activeChallenge.remaining = 0;
          stopChallengeTimer();
          sfxTick();
        }
        if (currentTab === 'challenges') {
          renderApp();
        }
      }, 1000);
      renderApp();
    }

    function startConstraintChallenge(index) {
      const ch = CONSTRAINT_CHALLENGES[index];
      if (!ch) return;
      startTimedChallenge(ch.title, ch.desc, 120, ch.rewardCoins, ch.rewardXp);
    }

    function completeActiveChallenge() {
      if (!activeChallenge) return;
      stopChallengeTimer();
      const { title, rewardCoins, rewardXp } = activeChallenge;
      activeChallenge = null;

      const beforeStage = getStageIndexFromXp(state.xp);
      state.coins += rewardCoins;
      state.xp += rewardXp;
      state.totalChallenges += 1;
      const afterStage = getStageIndexFromXp(state.xp);
      saveState();

      sfxVictory();
      if (afterStage > beforeStage) {
        showToast(`${title} validé ! ${state.petName} est maintenant ${EVOLUTION_STAGES[afterStage].label} !`, 'success');
      } else {
        showToast(`${title} validé ! +${rewardCoins} pièces • +${rewardXp} XP`, 'success');
      }
      currentTab = 'sanctuary';
      renderApp();
    }

    function cancelActiveChallenge() {
      stopChallengeTimer();
      activeChallenge = null;
      sfxClick();
      renderApp();
    }

              </div>
              <div>
                <div class="text-xs font-bold text-white">${item.name}</div>
                <div class="text-[11px] text-slate-400">${item.desc}</div>
              </div>
            </div>
            <div class="shrink-0">
              ${actionBtn}
            </div>
          </div>
        `;
      }).join('');

      container.innerHTML = `
        <div class="p-4 space-y-4">
          <div class="flex items-center justify-between">
            <div>
              <h2 class="text-lg font-extrabold text-white">Boutique</h2>
              <p class="text-xs text-slate-400">Débloque des récompenses avec tes pièces.</p>
            </div>
            <div class="px-3 py-1.5 rounded-2xl bg-amber-500/15 border border-amber-500/30 text-amber-300 text-xs font-bold">
              🪙 ${state.coins}
            </div>
          </div>

          <div class="flex gap-2">
            ${tabsHtml}
          </div>

          <div class="space-y-2.5">
            ${itemsHtml}
          </div>
        </div>
      `;
    }

    function setShopCategory(cat) {
      sfxClick();
      shopCategory = cat;
      renderApp();
    }

    function buyItem(itemId) {
      const item = SHOP_ITEMS.find((i) => i.id === itemId);
      if (!item || state.ownedItems.includes(item.id)) return;
      if (state.coins < item.price) {
        showToast("Pas assez de pièces pour cet article.", 'warning');
        return;
      }

      state.coins -= item.price;
      state.ownedItems.push(item.id);
      if (item.category === 'habitat') {
        state.equippedHabitat = item.id;
      } else if (item.category === 'accessory' && item.slot) {
        state.equippedAccessories[item.slot] = item.id;
      }
      saveState();
      sfxCoin();
      showToast(`${item.name} débloqué !`, 'success');
      renderApp();
    }

    function toggleEquipItem(itemId) {
      const item = SHOP_ITEMS.find((i) => i.id === itemId);
      if (!item || !state.ownedItems.includes(item.id)) return;
      sfxClick();

      if (item.category === 'habitat') {
        state.equippedHabitat = state.equippedHabitat === item.id ? 'hab_clearing' : item.id;
      } else if (item.category === 'accessory' && item.slot) {
        state.equippedAccessories[item.slot] = state.equippedAccessories[item.slot] === item.id ? null : item.id;
      }
      saveState();
      renderApp();
    }

    function buyAndFeed(itemId) {
      const item = SHOP_ITEMS.find((i) => i.id === itemId);
      if (!item || item.category !== 'care') return;
      if (state.coins < item.price) {
        showToast("Pas assez de pièces pour cette friandise.", 'warning');
        return;
      }

      const beforeStage = getStageIndexFromXp(state.xp);
      state.coins -= item.price;
      state.energy = Math.min(100, state.energy + (item.effectValue || 20));
      if (item.effectType === 'feast') {
        state.xp += 30;
      }
      const afterStage = getStageIndexFromXp(state.xp);
      saveState();

      currentEatingItem = item;
      if (eatingTimeout) clearTimeout(eatingTimeout);
      eatingTimeout = setTimeout(() => {
        currentEatingItem = null;
        if (currentTab === 'sanctuary') {
          renderApp();
        }
      }, 2200);

      sfxPet();
      showToast(`${state.petName} savoure : ${item.name} !`, 'success');
      if (afterStage > beforeStage) {
        sfxVictory();
        showToast(`Nouveau stade : ${EVOLUTION_STAGES[afterStage].label} !`, 'success');
      }

      currentTab = 'sanctuary';
      renderApp();
    }

    // =========================================================================
    // 10. BOUCLE DE RENDU PRINCIPALE
    // =========================================================================
    function renderApp() {
      updateSoundIcon();
      updateNavActive();

      const main = document.getElementById('main-content');
      if (!main) return;

      if (!state.adopted) {
        renderAdoptionScreen(main);
        return;
      }

      if (currentTab === 'challenges') {
        renderChallengesTab(main);
      } else if (currentTab === 'shop') {
        renderShopTab(main);
      } else {
        renderSanctuaryTab(main);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderApp();
    });
  </script>
</body>
</html>
