    * {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #090C10;
      color: #F8FAFC;
      margin: 0;
      padding: 0;
    }

    @keyframes petBreathe {
      0%, 100% { transform: scale(1) translateY(0); }
      50% { transform: scale(1.035) translateY(-4px); }
    }
    .anim-breathe {
      animation: petBreathe 3.2s ease-in-out infinite;
    }

    @keyframes petTiredBreathe {
      0%, 100% { transform: scale(0.98) translateY(2px); filter: saturate(0.75) brightness(0.9); }
      50% { transform: scale(1.00) translateY(4px); filter: saturate(0.75) brightness(0.9); }
    }
    .anim-tired {
      animation: petTiredBreathe 4.5s ease-in-out infinite;
    }

    @keyframes petBounce {
      0%, 100% { transform: scale(1); }
      35% { transform: scale(1.08) translateY(-8px); }
      70% { transform: scale(0.96); }
    }
    .anim-bounce {
      animation: petBounce 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes sparkleFloat {
      0%, 100% { opacity: 0.25; transform: translateY(0) scale(0.8); }
      50% { opacity: 0.95; transform: translateY(-10px) scale(1.15); }
    }
    .sparkle-dot {
      animation: sparkleFloat 2.8s ease-in-out infinite;
    }

    @keyframes floatUpFade {
      0% { opacity: 1; transform: translateY(0) scale(0.8); }
      100% { opacity: 0; transform: translateY(-48px) scale(1.35); }
    }
    .floating-particle {
      animation: floatUpFade 0.9s ease-out forwards;
      pointer-events: none;
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #0D1117; }
    ::-webkit-scrollbar-thumb { background: #232D3F; border-radius: 4px; }

    let soundEnabled = true;
    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx && (window.AudioContext || window.webkitAudioContext)) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        audioCtx = new Ctx();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }

    function playTone(freq, duration = 0.12, type = 'sine', gainVal = 0.08, delay = 0) {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime + delay);
        gain.gain.setValueAtTime(gainVal, ctx.currentTime + delay);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime + delay);
        osc.stop(ctx.currentTime + delay + duration);
      } catch (e) {}
    }

    function updateSoundIcon() {
      const onIcon = document.getElementById('icon-sound-on');
      const offIcon = document.getElementById('icon-sound-off');
      if (!onIcon || !offIcon) return;
      if (soundEnabled) {
        onIcon.classList.remove('hidden');
        offIcon.classList.add('hidden');
      } else {
        onIcon.classList.add('hidden');
        offIcon.classList.remove('hidden');
      }
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      updateSoundIcon();
      if (soundEnabled) sfxClick();
    }

    // =========================================================================
    // 3. ÉTAT PERSISTANT, INACTIVITÉ 24H & TRANSITION D'ÂGE

    const STORAGE_KEY = 'rangement_quest_state_v3';

    let currentTab = 'sanctuary';

    function getDefaultState() {
      return {

        lastEra: 'baby',
        lastActiveAt: Date.now()
      };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return getDefaultState();
        const parsed = JSON.parse(raw);
        const merged = {
          ...getDefaultState(),
          ...parsed,
          equippedSlots: Array.isArray(parsed.equippedSlots) && parsed.equippedSlots.length === 4
            ? parsed.equippedSlots
            : [null, null, null, null]
        };
        if (!HABITAT_THEMES[merged.equippedHabitat]) {
          merged.equippedHabitat = 'none';
        }
        return merged;
      } catch (e) {
        return getDefaultState();
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
    }

    let state = loadState();

    // Vérifie si 24h ou plus se sont écoulées sans visite (-10% par tranche de 24h)
    function applyInactivityDecay(silent = false) {
      if (!state.adopted) {
        state.lastActiveAt = Date.now();
        saveState();
        return;
      }
      const now = Date.now();
      const last = state.lastActiveAt || now;
      const elapsed = now - last;
      const daysPassed = Math.floor(elapsed / DAY_MS);

      if (daysPassed >= 1) {
        const loss = daysPassed * 10;
        const oldEnergy = state.energy;
        state.energy = Math.max(10, state.energy - loss);
        state.lastActiveAt = last + daysPassed * DAY_MS;
        saveState();
        if (!silent && state.energy < oldEnergy) {
          showToast(`😴 ${daysPassed} jour(s) sans visite : énergie -${oldEnergy - state.energy}%`, 'info');
        }
      } else {
        state.lastActiveAt = now;
        saveState();
      }
    }

    // =========================================================================
    // 4. HELPERS VISUELS & PROGRESSION
    // =========================================================================
    function getStageIndexFromXp(xp) {
      let idx = 0;
      for (let i = 0; i < EVOLUTION_STAGES.length; i++) {
        if (xp >= EVOLUTION_STAGES[i].minXp) {
          idx = i;
        }
      }
      return idx;
    }

    function getStageInfoFromXp(xp) {
      const idx = getStageIndexFromXp(xp);
      const current = EVOLUTION_STAGES[idx] || EVOLUTION_STAGES[0];
      const next = EVOLUTION_STAGES[idx + 1] || null;
      return {
        index: idx,
        current,
        next,
        isMax: !next
      };
    }

    function getCurrentEra() {
      return getStageInfoFromXp(state.xp).current.era;
    }

    // Ajoute de l'XP et vide automatiquement les 4 cases d'accessoires quand il passe Junior
    function grantXp(amount) {
      const prevStage = getStageInfoFromXp(state.xp);
      state.xp += amount;
      const newStage = getStageInfoFromXp(state.xp);

      if (prevStage.current.era === 'baby' && newStage.current.era === 'grown') {
        state.equippedSlots = [null, null, null, null];
        state.lastEra = 'grown';
        showToast(`🎉 ${state.petName} devient ${newStage.current.label} ! Nouveaux objets en boutique !`, 'success');
      } else if (newStage.index > prevStage.index) {
        showToast(`✨ Évolution ! ${state.petName} est maintenant ${newStage.current.label} !`, 'success');
      }
    }

    function getLocalPetImageCandidates(speciesId, xp = 0) {
      const cfg = SPECIES_VISUAL_CONFIG[speciesId] || SPECIES_VISUAL_CONFIG.loutre;
      const stageIndex = getStageIndexFromXp(xp);
      const candidates = [];

      if (Array.isArray(cfg.localStageImages) && cfg.localStageImages[stageIndex]) {
        candidates.push(cfg.localStageImages[stageIndex]);
      }
      if (Array.isArray(cfg.localStageImages)) {
        cfg.localStageImages.forEach((imgPath) => {
          if (imgPath && !candidates.includes(imgPath)) {
            candidates.push(imgPath);
          }
        });
      }
      if (cfg.localFallback && !candidates.includes(cfg.localFallback)) {
        candidates.push(cfg.localFallback);
      }
      return candidates;
    }

    function renderLocalImageWithFallback(candidates, altText, extraClasses, styleAttr, fallbackHtml) {
      const cleanList = (Array.isArray(candidates) ? candidates : [candidates]).filter(Boolean);
      if (!cleanList.length) {
        return fallbackHtml;
      }

      const encodedList = encodeURIComponent(JSON.stringify(cleanList));
      const firstSrc = cleanList[0];

      return `
        <img
          src="${firstSrc}"
          alt="${altText}"
          data-candidates="${encodedList}"
          data-candidate-index="0"
          class="${extraClasses || ''}"
          style="${styleAttr || ''}"
          onerror="handleLocalImageError(this)"
        />
        <div class="local-img-fallback hidden w-full h-full">${fallbackHtml}</div>
      `;
    }

    window.handleLocalImageError = function (imgEl) {
      try {
        const rawList = imgEl.getAttribute('data-candidates');
        const currentIdx = parseInt(imgEl.getAttribute('data-candidate-index') || '0', 10);
        const candidates = rawList ? JSON.parse(decodeURIComponent(rawList)) : [];
        const nextIdx = currentIdx + 1;

        if (nextIdx < candidates.length) {
          imgEl.setAttribute('data-candidate-index', String(nextIdx));
          imgEl.src = candidates[nextIdx];
          return;
        }
      } catch (e) {}

      imgEl.classList.add('hidden');
      const fallbackEl = imgEl.parentElement && imgEl.parentElement.querySelector('.local-img-fallback');
      if (fallbackEl) {
        fallbackEl.classList.remove('hidden');
      }
    };

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const colorMap = {
        success: 'bg-emerald-950/95 border-emerald-500/40 text-emerald-200',
        warning: 'bg-amber-950/95 border-amber-500/40 text-amber-200',
        info: 'bg-[#151B26]/95 border-blue-500/40 text-slate-100'
      };

      const toast = document.createElement('div');
      toast.className = `px-4 py-2.5 rounded-2xl border backdrop-blur-md text-xs font-semibold shadow-xl transition-all duration-300 text-center ${colorMap[type] || colorMap.info}`;
      toast.textContent = message;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-8px)';
        setTimeout(() => toast.remove(), 300);
      }, 2600);
    }

    function petCompanion(event) {
      sfxPet();
      state.energy = Math.min(100, state.energy + 3);
      state.lastActiveAt = Date.now();
      saveState();

      const card = document.getElementById('pet-stage-card');
      if (card) {
        const heart = document.createElement('div');
        heart.className = 'floating-particle absolute z-30 text-xl';
        heart.style.left = '50%';
        heart.style.top = '45%';
        heart.textContent = '💖';
        card.appendChild(heart);
        setTimeout(() => heart.remove(), 900);
      }

      renderSanctuary();
    }

    function quickFeed() {
      const era = getCurrentEra();
      const food = era === 'baby'
        ? { id: 'baby_milk', name: 'Lait Chaud Étoilé', icon: '🥛', price: 15, effectEnergy: 15, effectXp: 5 }
        : { id: 'grown_apple', name: 'Pomme Croquante', icon: '🍎', price: 20, effectEnergy: 15, effectXp: 10 };

      if (state.coins < food.price) {
        showToast(`Pas assez de pièces (${food.price} 🪙 requis).`, 'warning');
        return;
      }

      sfxCoin();
      state.coins -= food.price;
      state.energy = Math.min(100, state.energy + food.effectEnergy);
      state.lastActiveAt = Date.now();
      grantXp(food.effectXp);
      saveState();

      eatingPreviewItem = food;
      renderSanctuary();
      setTimeout(() => {
        eatingPreviewItem = null;
        if (currentTab === 'sanctuary') renderSanctuary();
      }, 1500);
    }

    function openSlotPicker(slotIndex) {
      sfxClick();
      shopCategory = 'accessory';
      switchTab('shop');
      showToast(`Choisis un accessoire pour remplir la case #${slotIndex + 1} !`, 'info');
    }

    function interactWithSlot(slotIndex) {
      const itemId = state.equippedSlots[slotIndex];
      const item = SHOP_ITEMS.find((i) => i.id === itemId);
      if (!item) return;

      sfxPet();
      state.energy = Math.min(100, state.energy + 2);
      state.lastActiveAt = Date.now();
      saveState();
      showToast(`${item.icon} ${state.petName} joue avec : ${item.name} (+2% énergie)`, 'success');
      renderSanctuary();
    }

          </div>

    function pickChallengeByDifficulty(difficulty, excludeId = null) {
      const pool = CONSTRAINT_CHALLENGES.filter((c) => c.difficulty === difficulty && c.id !== excludeId);
      const list = pool.length ? pool : CONSTRAINT_CHALLENGES.filter((c) => c.difficulty === difficulty);
      return list[Math.floor(Math.random() * list.length)];
    }

    function startRandomChallengeAnyDifficulty() {
      const diffs = ['easy', 'medium', 'hard'];
      const pick = diffs[Math.floor(Math.random() * diffs.length)];
      startConstraintChallenge(pick);
    }

    function startConstraintChallenge(difficulty = 'medium', excludeId = null) {
      sfxClick();
      stopChallengeTimer();
      const chosen = pickChallengeByDifficulty(difficulty, excludeId);

      activeChallenge = {
        type: 'constraint',
        challenge: chosen,
        remainingSeconds: chosen.minSeconds,
        totalSeconds: chosen.minSeconds
      };

      renderChallenges();
      challengeTimerInterval = setInterval(() => {
        if (!activeChallenge || activeChallenge.type !== 'constraint') {
          stopChallengeTimer();
          return;
        }
        if (activeChallenge.remainingSeconds > 0) {
          activeChallenge.remainingSeconds -= 1;
          if (activeChallenge.remainingSeconds <= 3 && activeChallenge.remainingSeconds > 0) {
            sfxTick();
          }
          if (activeChallenge.remainingSeconds === 0) {
            sfxVictory();
          }
          renderChallenges();
        } else {
          stopChallengeTimer();
        }
      }, 1000);
    }

    function rerollConstraintChallenge(direction) {
      if (!activeChallenge || activeChallenge.type !== 'constraint') return;
      const order = ['easy', 'medium', 'hard'];
      const currentDiff = activeChallenge.challenge.difficulty;
      const idx = order.indexOf(currentDiff);

      let targetDiff = currentDiff;
      if (direction === 'easier') {
        targetDiff = order[Math.max(0, idx - 1)];
      } else if (direction === 'harder') {
        targetDiff = order[Math.min(order.length - 1, idx + 1)];
      }

      startConstraintChallenge(targetDiff, activeChallenge.challenge.id);
    }

    function startSprint30() {
      sfxClick();
      stopChallengeTimer();
      activeChallenge = {
        type: 'sprint30',
        remainingSeconds: 30,
        count: 0
      };
      renderChallenges();

      challengeTimerInterval = setInterval(() => {
        if (!activeChallenge || activeChallenge.type !== 'sprint30') {
          stopChallengeTimer();
          return;
        }
        if (activeChallenge.remainingSeconds > 0) {
          activeChallenge.remainingSeconds -= 1;
          if (activeChallenge.remainingSeconds <= 3 && activeChallenge.remainingSeconds > 0) {
            sfxTick();
          }
          if (activeChallenge.remainingSeconds === 0) {
            sfxVictory();
          }
          renderChallenges();
        } else {
          stopChallengeTimer();
        }
      }, 1000);
    }

    function incrementSprintCount() {
      if (!activeChallenge || activeChallenge.type !== 'sprint30' || activeChallenge.remainingSeconds <= 0) return;
      sfxClick();
      activeChallenge.count += 1;
      renderChallenges();
    }

    function startRace10() {
      sfxClick();
      stopChallengeTimer();
      activeChallenge = {
        type: 'race10',
        elapsedSeconds: 0,
        minSeconds: 20
      };
      renderChallenges();

      challengeTimerInterval = setInterval(() => {
        if (!activeChallenge || activeChallenge.type !== 'race10') {
          stopChallengeTimer();
          return;
        }
        activeChallenge.elapsedSeconds += 1;
        if (activeChallenge.elapsedSeconds === activeChallenge.minSeconds) {
          sfxVictory();
        }
        renderChallenges();
      }, 1000);
    }

    function cancelActiveChallenge() {
      stopChallengeTimer();
      activeChallenge = null;
      renderChallenges();
    }

    function completeActiveChallenge() {
      if (!activeChallenge) return;

      let earnedCoins = 20;
      let earnedXp = 20;

      if (activeChallenge.type === 'constraint') {
        if (activeChallenge.remainingSeconds > 0) {
          showToast(`🔒 Attends la fin du chrono (${activeChallenge.remainingSeconds}s) avant de valider !`, 'warning');
          return;
        }
        earnedCoins = activeChallenge.challenge.rewardCoins;
        earnedXp = activeChallenge.challenge.rewardXp;
      } else if (activeChallenge.type === 'sprint30') {
        if (activeChallenge.remainingSeconds > 0) {
          showToast(`🔒 Le sprint n'est pas encore terminé (${activeChallenge.remainingSeconds}s) !`, 'warning');
          return;
        }
        const items = Math.max(1, activeChallenge.count);
        earnedCoins = Math.min(45, 10 + items * 2);
        earnedXp = Math.min(45, 10 + items * 2);
        if (activeChallenge.count > state.bestSprint30) {
          state.bestSprint30 = activeChallenge.count;
        }
      } else if (activeChallenge.type === 'race10') {
        const left = activeChallenge.minSeconds - activeChallenge.elapsedSeconds;
        if (left > 0) {
          showToast(`🔒 Encore ${left}s minimum pour bien ranger les 10 objets !`, 'warning');
          return;
        }
        earnedCoins = activeChallenge.elapsedSeconds <= 45 ? 35 : 25;
        earnedXp = activeChallenge.elapsedSeconds <= 45 ? 35 : 25;
        if (!state.bestRace10 || activeChallenge.elapsedSeconds < state.bestRace10) {
          state.bestRace10 = activeChallenge.elapsedSeconds;
        }
      }

      stopChallengeTimer();
      activeChallenge = null;

      sfxVictory();
      state.coins += earnedCoins;
      state.totalChallenges += 1;
      // Un défi demande un petit effort d'énergie (-6%), équilibré avec les soins et friandises
      state.energy = Math.max(10, state.energy - 6);
      state.lastActiveAt = Date.now();
      grantXp(earnedXp);
      saveState();

      showToast(`🏆 Bravo ! +${earnedCoins} 🪙 et +${earnedXp} XP !`, 'success');
      switchTab('sanctuary');
    }

                    🔄 Autre défi
                  </button>
                  <button
                    onclick="rerollConstraintChallenge('harder')"
                    ${ch.difficulty === 'hard' ? 'disabled' : ''}
                    class="py-2 px-2 rounded-xl border text-[11px] font-bold transition ${ch.difficulty === 'hard' ? 'opacity-40 cursor-not-allowed bg-slate-900 border-white/5 text-slate-500' : 'bg-purple-500/15 hover:bg-purple-500/25 border-purple-500/30 text-purple-200'}"
                  >
                    ⬆ Plus dur

              <button
                onclick="completeActiveChallenge()"

                  ? 'bg-slate-800 border border-white/10 text-slate-400 cursor-not-allowed'
                  : 'bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white shadow-lg shadow-emerald-600/25 active:scale-[0.98]'}"
              >
                ${isLocked
                  ? `🔒 Verrouillé (${activeChallenge.remainingSeconds}s restantes)`
                  : `✅ J'ai fini ! Réclamer +${ch.rewardCoins} 🪙 & +${ch.rewardXp} XP`}
              </button>
            </div>
          </div>
        `;
        return;
      }

      if (activeChallenge.type === 'sprint30') {
        const isLocked = activeChallenge.remainingSeconds > 0;

              <button
                onclick="completeActiveChallenge()"
                ${isLocked ? 'disabled' : ''}
                class="w-full py-3.5 rounded-2xl text-xs font-extrabold transition ${isLocked
                  ? 'bg-slate-800 border border-white/10 text-slate-400 cursor-not-allowed'
                  : 'bg-emerald-600 hover:bg-emerald-500 text-white shadow-lg'}"
              >
                ${isLocked
                  ? `🔒 Attends la fin du chrono (${activeChallenge.remainingSeconds}s)`
                  : '✅ Réclamer ma récompense !'}
              </button>
            </div>
          </div>
        `;
        return;
      }

      if (activeChallenge.type === 'race10') {
        const left = Math.max(0, activeChallenge.minSeconds - activeChallenge.elapsedSeconds);
        const isLocked = left > 0;
        container.innerHTML = `
          <div class="p-4 space-y-4">
            <div class="flex items-center justify-between">
              <button onclick="cancelActiveChallenge()" class="text-xs font-semibold text-slate-400 hover:text-white">← Abandonner</button>
              <span class="text-xs font-bold text-emerald-300">🏁 Course aux 10 objets</span>
            </div>

            <div class="bg-[#151B26] border border-[#2A3548] rounded-3xl p-5 space-y-4 text-center">
              <div class="text-4xl font-black text-white">${activeChallenge.elapsedSeconds}s</div>
              <p class="text-xs text-slate-300">Range 10 objets le plus proprement possible.</p>

              <button
                onclick="completeActiveChallenge()"
                ${isLocked ? 'disabled' : ''}
                class="w-full py-3.5 rounded-2xl text-xs font-extrabold transition ${isLocked
                  ? 'bg-slate-800 border border-white/10 text-slate-400 cursor-not-allowed'
                  : 'bg-emerald-600 hover:bg-emerald-500 text-white shadow-lg'}"
              >
                ${isLocked
                  ? `🔒 Verrouillé encore ${left}s`
                  : "✅ J'ai rangé les 10 objets !"}
              </button>
            </div>
          </div>
        `;
      }
    }

    // =========================================================================
    // 9. ONGLET BOUTIQUE (ADAPTÉE À L'ÂGE + 4 CASES D'ACCESSOIRES)
    // =========================================================================
    function renderShop() {
      const nav = document.getElementById('bottom-nav');
      if (nav) nav.classList.remove('hidden');

      const main = document.getElementById('main-content');
      const era = getCurrentEra();
      const eraLabel = era === 'baby' ? 'Collection Bébé' : 'Collection Grand (Junior & Adulte)';

      const filteredItems = SHOP_ITEMS.filter((item) => {
        if (item.category !== shopCategory) return false;
        if (item.era === 'all') return true;
        return item.era === era;
      });

      const equippedCount = state.equippedSlots.filter(Boolean).length;

      main.innerHTML = `
        <div class="p-4 space-y-4">
          <div class="flex items-center justify-between">
            <div>
              <h2 class="text-lg font-extrabold text-white">Boutique</h2>
              <p class="text-[11px] text-slate-400">${eraLabel}</p>
            </div>
            <div class="px-3 py-1.5 rounded-full bg-amber-500/15 border border-amber-500/30 text-amber-300 text-xs font-extrabold">
              🪙 ${state.coins}
            </div>
          </div>

          <!-- Sous-onglets Boutique -->
          <div class="grid grid-cols-3 gap-2 bg-[#151B26] p-1.5 rounded-2xl border border-[#232D3F]">
            <button onclick="setShopCategory('accessory')" class="py-2 rounded-xl text-xs font-bold transition ${shopCategory === 'accessory' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white'}">
              🧸 Accessoires
            </button>
            <button onclick="setShopCategory('habitat')" class="py-2 rounded-xl text-xs font-bold transition ${shopCategory === 'habitat' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white'}">
              🏡 Habitats
            </button>
            <button onclick="setShopCategory('care')" class="py-2 rounded-xl text-xs font-bold transition ${shopCategory === 'care' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white'}">
              🍼 Friandises
            </button>
          </div>

          ${shopCategory === 'accessory' ? `
            <div class="px-3 py-2 rounded-2xl bg-blue-500/10 border border-blue-500/25 flex items-center justify-between text-xs">
              <span class="text-blue-200 font-medium">Cases occupées autour de ${state.petName} :</span>
              <span class="font-extrabold text-white">${equippedCount} / 4</span>
            </div>
          ` : ''}

          <!-- Liste des articles -->
          <div class="space-y-2.5">
            ${filteredItems.map((item) => {
              const isOwned = state.ownedItems.includes(item.id);
              const isEquippedSlot = shopCategory === 'accessory' && state.equippedSlots.includes(item.id);
              const isEquippedHab = shopCategory === 'habitat' && state.equippedHabitat === item.id;

              let actionBtn = '';
              if (shopCategory === 'care') {
                actionBtn = `
                  <button onclick="buyOrUseItem('${item.id}')" class="px-3.5 py-2 rounded-xl bg-amber-500/20 hover:bg-amber-500/30 border border-amber-400/40 text-amber-200 text-xs font-bold transition active:scale-95">
                    Donner · ${item.price} 🪙
                  </button>
                `;
              } else if (isEquippedSlot || isEquippedHab) {
                actionBtn = `
                  <button onclick="buyOrUseItem('${item.id}')" class="px-3.5 py-2 rounded-xl bg-emerald-500/20 border border-emerald-400/40 text-emerald-200 text-xs font-bold">
                    ✓ Placé
                  </button>
                `;
              } else if (isOwned) {
                actionBtn = `
                  <button onclick="buyOrUseItem('${item.id}')" class="px-3.5 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold transition">
                    Installer
                  </button>
                `;
              } else {
                actionBtn = `
                  <button onclick="buyOrUseItem('${item.id}')" class="px-3.5 py-2 rounded-xl bg-[#1E2634] hover:bg-blue-600 border border-white/10 text-white text-xs font-bold transition active:scale-95">
                    Acheter · ${item.price} 🪙
                  </button>
                `;
              }

              return `
                <div class="bg-[#151B26] border border-[#232D3F] rounded-2xl p-3.5 flex items-center justify-between gap-3">
                  <div class="flex items-center gap-3 min-w-0">
                    <div class="w-12 h-12 rounded-2xl bg-[#0D1117] border border-white/5 flex items-center justify-center text-2xl shrink-0">
                      ${item.icon}
                    </div>
                    <div class="min-w-0">
                      <h3 class="text-sm font-bold text-white truncate">${item.name}</h3>
                      <p class="text-[11px] text-slate-400 line-clamp-2">${item.desc}</p>
                    </div>
                  </div>
                  <div class="shrink-0">${actionBtn}</div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function setShopCategory(cat) {
      sfxClick();
      shopCategory = cat;
      renderShop();
    }

    function buyOrUseItem(itemId) {
      const item = SHOP_ITEMS.find((i) => i.id === itemId);
      if (!item) return;

      // 1. Friandises / Repas
      if (item.category === 'care') {
        if (state.coins < item.price) {
          showToast(`Il te manque ${item.price - state.coins} 🪙 !`, 'warning');
          return;
        }
        sfxCoin();
        state.coins -= item.price;
        state.energy = Math.min(100, state.energy + (item.effectEnergy || 15));
        state.lastActiveAt = Date.now();
        grantXp(item.effectXp || 10);
        saveState();
        showToast(`${item.icon} ${state.petName} se régale ! +${item.effectEnergy}% énergie`, 'success');
        renderShop();
        return;
      }

      // 2. Achat si pas encore possédé
      if (!state.ownedItems.includes(item.id)) {
        if (state.coins < item.price) {
          showToast(`Il te manque ${item.price - state.coins} 🪙 !`, 'warning');
          return;
        }
        state.coins -= item.price;
        state.ownedItems.push(item.id);
        sfxCoin();
      } else {
        sfxClick();
      }

      // 3. Équipement Habitat
      if (item.category === 'habitat') {
        state.equippedHabitat = item.id;
        state.lastActiveAt = Date.now();
        saveState();
        showToast(`🏡 Habitat installé : ${item.name}`, 'success');
        renderShop();
        return;
      }

      // 4. Placement dans l'une des 4 cases autour de l'animal
      if (item.category === 'accessory') {
        const existingIdx = state.equippedSlots.indexOf(item.id);
        if (existingIdx !== -1) {
          // Retirer de la case si on reclique dessus
          state.equippedSlots[existingIdx] = null;
          saveState();
          showToast(`${item.name} rangé.`, 'info');
          renderShop();
          return;
        }

        const emptyIdx = state.equippedSlots.indexOf(null);
        if (emptyIdx !== -1) {
          state.equippedSlots[emptyIdx] = item.id;
        } else {
          // Si les 4 cases sont pleines, remplace la plus ancienne (case 0)
          state.equippedSlots.shift();
          state.equippedSlots.push(item.id);
        }
        state.lastActiveAt = Date.now();
        saveState();
        showToast(`${item.icon} ${item.name} ajouté à côté de ${state.petName} !`, 'success');
        renderShop();
      }
    }

    // =========================================================================
    // 10. MENU DÉMO & NAVIGATION GLOBALE
    // =========================================================================
    function openDemoModal() {
      sfxClick();
      openModal(`
        <div class="flex items-center justify-between">
          <h3 class="text-base font-extrabold text-white">⚙️ Outils Démo & Test</h3>
          <button onclick="closeModal()" class="text-slate-400 hover:text-white text-sm font-bold">✕</button>
        </div>
        <p class="text-xs text-slate-400">Teste rapidement l'évolution, les achats et la baisse d'énergie après 24h.</p>
        <div class="space-y-2">
          <button onclick="demoAddCoins()" class="w-full py-2.5 px-3 rounded-xl bg-amber-500/15 hover:bg-amber-500/25 border border-amber-500/30 text-amber-200 text-xs font-bold text-left">
            🪙 Ajouter +100 pièces
          </button>
          <button onclick="demoAddXp()" class="w-full py-2.5 px-3 rounded-xl bg-blue-500/15 hover:bg-blue-500/25 border border-blue-500/30 text-blue-200 text-xs font-bold text-left">
            🌱 Ajouter +130 XP (faire grandir)
          </button>
          <button onclick="demoSimulate48h()" class="w-full py-2.5 px-3 rounded-xl bg-purple-500/15 hover:bg-purple-500/25 border border-purple-500/30 text-purple-200 text-xs font-bold text-left">
            😴 Simuler 48h sans visite (-20% énergie)
          </button>
          <button onclick="demoResetAll()" class="w-full py-2.5 px-3 rounded-xl bg-rose-500/15 hover:bg-rose-500/25 border border-rose-500/30 text-rose-200 text-xs font-bold text-left">
            🔄 Réinitialiser la partie
          </button>
        </div>
      `);
    }

    function demoAddCoins() {
      sfxCoin();
      state.coins += 100;
      saveState();
      closeModal();
      showToast('+100 pièces ajoutées !', 'success');
      renderCurrentView();
    }

    function demoAddXp() {
      sfxVictory();
      grantXp(130);
      saveState();
      closeModal();
      renderCurrentView();
    }

    function demoSimulate48h() {
      state.lastActiveAt = Date.now() - (2 * DAY_MS + 1000);
      applyInactivityDecay(false);
      closeModal();
      renderCurrentView();
    }

    function demoResetAll() {
      stopChallengeTimer();
      activeChallenge = null;
      state = getDefaultState();
      saveState();
      closeModal();
      showToast('Partie réinitialisée.', 'info');
      renderOnboarding();
    }

    function switchTab(tabName) {
      sfxClick();
      currentTab = tabName;

      document.querySelectorAll('.nav-btn').forEach((btn) => {
        btn.classList.remove('text-blue-400');
        btn.classList.add('text-slate-400');
      });
      const activeBtn = document.getElementById(`nav-${tabName}`);
      if (activeBtn) {
        activeBtn.classList.remove('text-slate-400');
        activeBtn.classList.add('text-blue-400');
      }

      renderCurrentView();
    }

    function renderCurrentView() {
      if (!state.adopted) {
        renderOnboarding();
        return;
      }
      if (currentTab === 'sanctuary') renderSanctuary();
      else if (currentTab === 'challenges') renderChallenges();
      else if (currentTab === 'shop') renderShop();
    }

    // Initialisation au chargement
    window.addEventListener('DOMContentLoaded', () => {
      updateSoundIcon();
      applyInactivityDecay(false);
      renderCurrentView();
    });
  </script>
</body>
</html>
