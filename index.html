    * {

      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #090C10;
      color: #F8FAFC;
      margin: 0;
      padding: 0;
    }

    @keyframes petBreathe {
      0%, 100% { transform: scale(1) translateY(0); }
      50% { transform: scale(1.035) translateY(-4px); }
    }
    .anim-breathe {
      animation: petBreathe 3.2s ease-in-out infinite;
    }

    @keyframes petTiredBreathe {
      0%, 100% { transform: scale(0.98) translateY(2px); filter: saturate(0.75) brightness(0.9); }
      50% { transform: scale(1.00) translateY(4px); filter: saturate(0.75) brightness(0.9); }
    }
    .anim-tired {
      animation: petTiredBreathe 4.5s ease-in-out infinite;
    }

    @keyframes petBounce {
      0%, 100% { transform: scale(1) rotate(0deg); }
      25% { transform: scale(1.1) translateY(-10px) rotate(-3deg); }
      50% { transform: scale(1.05) translateY(-4px) rotate(3deg); }
      75% { transform: scale(1.08) translateY(-8px) rotate(-2deg); }
    }
    .anim-bounce {
      animation: petBounce 0.65s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }

    @keyframes floatUpFade {
      0% { opacity: 1; transform: translateY(0) scale(0.8); }
      100% { opacity: 0; transform: translateY(-48px) scale(1.35); }
    }
    .floating-particle {
      animation: floatUpFade 0.9s ease-out forwards;
      pointer-events: none;
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #0D1117; }
    ::-webkit-scrollbar-thumb { background: #232D3F; border-radius: 4px; }

    // 1. MOTEUR SONORE WEB AUDIO API
    // =========================================================================
    let audioCtx = null;

    function getAudioCtx() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) audioCtx = new AudioContextClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }

    function playTone(freq, duration = 0.12, type = 'sine', volume = 0.08, delay = 0) {
      if (!state || !state.soundEnabled) return;
      const ctx = getAudioCtx();
      if (!ctx) return;

      const now = ctx.currentTime + delay;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, now);

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(volume, now + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + duration + 0.02);
    }

    function sfxClick() { playTone(520, 0.07, 'triangle', 0.05); }
    function sfxCoin() {
      playTone(987.77, 0.09, 'sine', 0.07, 0);
      playTone(1318.51, 0.18, 'sine', 0.07, 0.08);
    }
    function sfxSuccess() {
      playTone(523.25, 0.11, 'triangle', 0.08, 0);
      playTone(659.25, 0.11, 'triangle', 0.08, 0.09);
      playTone(783.99, 0.14, 'triangle', 0.08, 0.18);
      playTone(1046.50, 0.28, 'triangle', 0.09, 0.27);
    }
    function sfxVictory() {
      const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
      notes.forEach((n, i) => playTone(n, 0.18, 'triangle', 0.09, i * 0.08));
    }
    function sfxPetSound(species) {
      if (species === 'chaton') {
        playTone(680, 0.14, 'sine', 0.07, 0);
        playTone(540, 0.22, 'sine', 0.06, 0.12);
      } else if (species === 'dragon') {
        playTone(220, 0.14, 'sawtooth', 0.05, 0);
        playTone(330, 0.2, 'triangle', 0.06, 0.1);
      } else if (species === 'corbeau') {
        playTone(420, 0.1, 'square', 0.04, 0);
        playTone(380, 0.12, 'square', 0.04, 0.13);
      } else if (species === 'grenouille') {
        playTone(280, 0.09, 'triangle', 0.06, 0);
        playTone(420, 0.14, 'triangle', 0.06, 0.09);
      } else if (species === 'faucon') {
        playTone(1180, 0.12, 'sine', 0.06, 0);
        playTone(920, 0.18, 'sine', 0.05, 0.1);
      } else if (species === 'souris' || species === 'ecureuil') {
        playTone(1350, 0.07, 'sine', 0.05, 0);
        playTone(1580, 0.08, 'sine', 0.05, 0.08);
      } else {
        playTone(620, 0.1, 'sine', 0.07, 0);
        playTone(840, 0.14, 'sine', 0.07, 0.09);
      }
    }

    // =========================================================================
    // 3. SAUVEGARDE LOCALE INDÉPENDANTE SUR CHAQUE TÉLÉPHONE
    // =========================================================================
    const STORAGE_KEY = 'rangement_quest_v2_state';
    const DAY_MS = 24 * 60 * 60 * 1000;

    function getDefaultState() {
      return {
        adopted: false,
        species: 'loutre',
        petName: '',
        xp: 0,
        coins: 40,
        energy: 85,
        habitat: 'clairiere',
        ownedHabitats: ['clairiere'],
        ownedItems: [],
        equippedItems: [],
        completedMissionsToday: [],
        lastMissionDate: new Date().toDateString(),
        lastActiveAt: Date.now(),
        soundEnabled: true
      };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return getDefaultState();
        const parsed = JSON.parse(raw);
        const merged = { ...getDefaultState(), ...parsed };
        if (merged.lastMissionDate !== new Date().toDateString()) {
          merged.completedMissionsToday = [];
          merged.lastMissionDate = new Date().toDateString();
        }
        return merged;
      } catch (e) {
        return getDefaultState();
      }
    }

    let state = loadState();
    let currentTab = 'sanctuary';
    let isJoyful = false;
    let joyMessage = '';
    let joyTimer = null;
    let activeChallenge = null;
    let challengeInterval = null;

    function saveState() {
      try {
        state.lastActiveAt = Date.now();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
    }

    function getCurrentStage() {
      let current = EVOLUTION_STAGES[0];
      for (const st of EVOLUTION_STAGES) {
        if (state.xp >= st.minXp) current = st;
      }
      return current;
    }

    function getStageIndex(stageId) {
      return EVOLUTION_STAGES.findIndex((s) => s.id === stageId);
    }

    function applyInactivityDecay(silent = true) {
      if (!state.adopted) return;
      const elapsed = Date.now() - (state.lastActiveAt || Date.now());
      const daysMissed = Math.floor(elapsed / DAY_MS);
      if (daysMissed >= 1) {
        const drop = Math.min(60, daysMissed * 10);
        state.energy = Math.max(20, state.energy - drop);
        state.lastActiveAt = Date.now();
        saveState();
        if (!silent) {
          showToast(`Ton compagnon s'est un peu ennuyé (-${drop}% d'énergie).`, 'info');
        }
      }
    }

    // =========================================================================
    // 4. UTILITAIRES UI, NOTIFICATIONS, MODALES & EFFETS DE JOIE
    // =========================================================================
    function showToast(text, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const colors = {
        success: 'bg-emerald-950/95 border-emerald-500/50 text-emerald-100',
        info: 'bg-slate-900/95 border-blue-500/40 text-slate-100',
        warn: 'bg-amber-950/95 border-amber-500/50 text-amber-100'
      };
      const el = document.createElement('div');
      el.className = `px-4 py-2.5 rounded-2xl border shadow-xl text-xs font-semibold text-center transition-all duration-300 ${colors[type] || colors.info}`;
      el.textContent = text;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(-8px)';
        setTimeout(() => el.remove(), 300);
      }, 2600);
    }

    function openModal(html) {
      const overlay = document.getElementById('modal-overlay');
      const box = document.getElementById('modal-box');
      if (!overlay || !box) return;
      box.innerHTML = html;
      overlay.classList.remove('hidden');
      overlay.classList.add('flex');
    }

    function closeModal() {
      const overlay = document.getElementById('modal-overlay');
      if (!overlay) return;
      overlay.classList.add('hidden');
      overlay.classList.remove('flex');
    }

    function toggleSound() {
      state.soundEnabled = !state.soundEnabled;
      saveState();
      updateSoundIcon();
      if (state.soundEnabled) sfxClick();
    }

    function updateSoundIcon() {
      const on = document.getElementById('icon-sound-on');
      const off = document.getElementById('icon-sound-off');
      if (!on || !off) return;
      if (state.soundEnabled) {
        on.classList.remove('hidden');
        off.classList.add('hidden');
      } else {
        on.classList.add('hidden');
        off.classList.remove('hidden');
      }
    }

    function triggerPetJoy(message = 'Youpi ! 💖', particleEmoji = '💖') {
      isJoyful = true;
      joyMessage = message;
      clearTimeout(joyTimer);
      renderSanctuary();

      const stageZone = document.getElementById('pet-visual-zone');
      if (stageZone) {
        const particles = [particleEmoji, '✨', '💖', '⭐'];
        particles.forEach((em, idx) => {
          const p = document.createElement('span');
          p.textContent = em;
          p.className = 'floating-particle absolute text-xl select-none z-20';
          p.style.left = `${22 + idx * 18}%`;
          p.style.top = `${28 + (idx % 2) * 14}%`;
          p.style.animationDelay = `${idx * 0.08}s`;
          stageZone.appendChild(p);
        });
      }

      joyTimer = setTimeout(() => {
        isJoyful = false;
        joyMessage = '';
        if (currentTab === 'sanctuary' && state.adopted) renderSanctuary();
      }, 1800);
    }

    function grantXp(amount) {
      const prevStage = getCurrentStage();
      state.xp += amount;
      const newStage = getCurrentStage();
      if (newStage.id !== prevStage.id) {
        sfxVictory();
        showToast(`✨ Incroyable ! ${state.petName} passe au stade ${newStage.label} !`, 'success');
      }
    }

      if (state.coins < 10) {

      state.coins -= 10;
      state.energy = Math.min(100, state.energy + 20);
      grantXp(8);
      saveState();
      sfxSuccess();
      triggerPetJoy('Miam ! Trop bon ! 😋', '🍓');

      if (state.completedMissionsToday.includes(missionId)) return;
      const m = QUICK_MISSIONS.find((x) => x.id === missionId);
      if (!m) return;

      state.completedMissionsToday.push(m.id);
      state.coins += m.coins;
      state.energy = Math.min(100, state.energy + 10);
      grantXp(m.xp);
      saveState();

      sfxSuccess();
      triggerPetJoy(`Bravo ! +${m.coins} 🪙 & +${m.xp} XP !`, '⭐');

                Défi en cours !
              </span>
              <h2 class="text-lg font-extrabold text-white">${activeChallenge.title}</h2>
              <p class="text-xs text-slate-400">${activeChallenge.desc}</p>
            </div>

            <div class="bg-[#151B26] border border-[#253044] rounded-3xl p-6 text-center space-y-4 shadow-xl">
              <div class="text-5xl font-extrabold tracking-tight text-white font-mono">${mins}:${secs}</div>
              <div class="w-full h-3 rounded-full bg-[#0D1117] overflow-hidden">
                <div style="width: ${pct}%" class="h-full bg-gradient-to-r from-amber-400 to-emerald-400 transition-all duration-500"></div>
              </div>
              <p class="text-xs text-slate-300">Récompense : <b class="text-amber-300">+${activeChallenge.coins} 🪙</b> et <b class="text-blue-300">+${activeChallenge.xp} XP</b></p>
            </div>

            <div class="space-y-2.5">
              <button onclick="finishActiveChallenge()"
                      class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-extrabold text-sm shadow-lg">
                J'ai fini de ranger ! 🎉
              </button>
              <button onclick="cancelActiveChallenge()"
                      class="w-full py-2.5 rounded-2xl bg-[#151B26] border border-[#253044] text-slate-400 hover:text-white text-xs font-semibold">
                Abandonner le chrono
              </button>
            </div>
          </div>
        `;
        return;
      }

      main.innerHTML = `
        <div class="p-4 space-y-4">
          <div class="space-y-1">
            <h2 class="text-lg font-extrabold text-white">⏱️ Défis Chrono</h2>
            <p class="text-xs text-slate-400">Lance un chronomètre et range un maximum avant la fin !</p>
          </div>

          <div class="space-y-3">
            ${TIMED_CHALLENGES.map((ch) => `
              <div class="bg-[#151B26] border border-[#1E2634] rounded-3xl p-4 space-y-3">
                <div class="flex items-start justify-between gap-2">
                  <div>
                    <h3 class="text-sm font-extrabold text-white">${ch.title}</h3>
                    <p class="text-xs text-slate-400 mt-0.5">${ch.desc}</p>
                  </div>
                  <span class="px-2.5 py-1 rounded-xl bg-amber-500/15 text-amber-300 text-xs font-extrabold shrink-0">
                    +${ch.coins} 🪙
                  </span>
                </div>
                <div class="flex items-center justify-between pt-1">
                  <span class="text-[11px] font-bold text-blue-300">+${ch.xp} XP de croissance</span>
                  <button onclick="startChallenge('${ch.id}')"
                          class="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold transition">
                    Démarrer ▶
                  </button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function startChallenge(challengeId) {
      const ch = TIMED_CHALLENGES.find((x) => x.id === challengeId);
      if (!ch) return;
      sfxClick();
      stopChallengeTimer();
      activeChallenge = { ...ch, remainingSec: ch.minutes * 60 };
      challengeInterval = setInterval(() => {
        if (!activeChallenge) return;
        activeChallenge.remainingSec -= 1;
        if (activeChallenge.remainingSec <= 0) {
          finishActiveChallenge();
        } else if (currentTab === 'challenges') {
          renderChallenges();
        }
      }, 1000);
      renderChallenges();
    }

    function stopChallengeTimer() {
      if (challengeInterval) {
        clearInterval(challengeInterval);
        challengeInterval = null;
      }
    }

    function finishActiveChallenge() {
      if (!activeChallenge) return;
      const done = activeChallenge;
      stopChallengeTimer();
      activeChallenge = null;

      state.coins += done.coins;
      state.energy = Math.min(100, state.energy + 15);
      grantXp(done.xp);
      saveState();

      sfxVictory();
      switchTab('sanctuary');
      triggerPetJoy(`Défi réussi ! +${done.coins} 🪙 !`, '🏆');
    }

    function cancelActiveChallenge() {
      sfxClick();
      stopChallengeTimer();
      activeChallenge = null;
      renderChallenges();
    }

    // =========================================================================
    // 8. BOUTIQUE (OBJETS PAR STADE & 10 HABITATS DÉBLOCABLES)
    // =========================================================================
    function renderShop() {
      const main = document.getElementById('main-content');
      const stage = getCurrentStage();
      const currentStageIdx = getStageIndex(stage.id);

      const stageItems = SHOP_ITEMS.filter((it) => it.stage === stage.id);
      const habitatsList = Object.values(HABITAT_THEMES);

      main.innerHTML = `
        <div class="p-4 space-y-5">
          <div class="flex items-center justify-between">
            <div>
              <h2 class="text-lg font-extrabold text-white">🛍️ Boutique</h2>
              <p class="text-xs text-slate-400">Collection stade <b class="text-blue-300">${stage.label}</b></p>
            </div>
            <div class="px-3.5 py-1.5 rounded-2xl bg-amber-500/15 border border-amber-500/30 text-amber-300 text-xs font-extrabold">
              🪙 ${state.coins}
            </div>
          </div>

          <div class="space-y-2.5">
            <h3 class="text-xs font-extrabold uppercase tracking-wider text-slate-400">Friandises & Accessoires (${stage.label})</h3>
            <div class="grid grid-cols-2 gap-2.5">
              ${stageItems.map((item) => {
                const isFood = item.type === 'food';
                const owned = !isFood && state.ownedItems.includes(item.id);
                const equipped = !isFood && state.equippedItems.includes(item.id);

                let btnLabel = `${item.price} 🪙`;
                let btnClass = 'bg-blue-600 hover:bg-blue-500 text-white';
                if (isFood) {
                  btnLabel = `Donner (${item.price} 🪙)`;
                  btnClass = 'bg-emerald-600 hover:bg-emerald-500 text-white';
                } else if (equipped) {
                  btnLabel = 'Équipé ✓';
                  btnClass = 'bg-purple-500/25 border border-purple-400/50 text-purple-200';
                } else if (owned) {
                  btnLabel = 'Équiper';
                  btnClass = 'bg-slate-700 hover:bg-slate-600 text-white';
                }

                return `
                  <div class="bg-[#151B26] border border-[#1E2634] rounded-2xl p-3 flex flex-col justify-between gap-2.5">
                    <div class="space-y-1">
                      <div class="flex items-center justify-between">
                        <span class="text-2xl">${item.emoji}</span>
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${isFood ? 'bg-emerald-500/15 text-emerald-300' : 'bg-blue-500/15 text-blue-300'}">
                          ${isFood ? 'Repas' : 'Objet'}
                        </span>
                      </div>
                      <div class="text-xs font-extrabold text-white">${item.name}</div>
                      <p class="text-[11px] text-slate-400 leading-snug">${item.desc}</p>
                    </div>
                    <button onclick="buyOrUseItem('${item.id}')" class="w-full py-2 rounded-xl text-xs font-bold transition ${btnClass}">
                      ${btnLabel}
                    </button>
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <div class="space-y-2.5 pt-1">
            <h3 class="text-xs font-extrabold uppercase tracking-wider text-slate-400">Habitats (${habitatsList.length} décors)</h3>
            <div class="space-y-2.5">
              ${habitatsList.map((hab) => {
                const reqIdx = getStageIndex(hab.unlockStage);
                const unlocked = currentStageIdx >= reqIdx;
                const reqStageObj = EVOLUTION_STAGES[reqIdx] || EVOLUTION_STAGES[0];
                const owned = state.ownedHabitats.includes(hab.id);
                const active = state.habitat === hab.id;

                let actionHtml = '';
                if (!unlocked) {
                  actionHtml = `<span class="px-2.5 py-1.5 rounded-xl bg-slate-800 text-slate-400 text-[11px] font-bold">🔒 Stade ${reqStageObj.label}</span>`;
                } else if (active) {
                  actionHtml = `<span class="px-3 py-1.5 rounded-xl bg-emerald-500/20 border border-emerald-400/40 text-emerald-200 text-xs font-bold">Installé ✓</span>`;
                } else if (owned) {
                  actionHtml = `<button onclick="equipHabitat('${hab.id}')" class="px-3 py-1.5 rounded-xl bg-slate-700 hover:bg-slate-600 text-white text-xs font-bold">Installer</button>`;
                } else {
                  actionHtml = `<button onclick="buyHabitat('${hab.id}')" class="px-3 py-1.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-extrabold">${hab.price} 🪙</button>`;
                }

                return `
                  <div class="bg-[#151B26] border ${active ? 'border-emerald-500/50' : 'border-[#1E2634]'} rounded-2xl p-3 flex items-center gap-3 ${!unlocked ? 'opacity-65' : ''}">
                    <div class="w-16 h-16 rounded-xl overflow-hidden shrink-0 relative flex items-center justify-center" style="background:${hab.fallbackGradient}">
                      <img src="${hab.bgImage}" alt="${hab.name}" onerror="this.style.display='none'" class="w-full h-full object-cover" />
                      <span class="absolute text-xl drop-shadow">${hab.emoji}</span>
                    </div>
                    <div class="flex-1 min-w-0">
                      <div class="text-xs font-extrabold text-white truncate">${hab.name}</div>
                      <p class="text-[11px] text-slate-400 line-clamp-2 leading-snug mt-0.5">${hab.desc}</p>
                    </div>
                    <div class="shrink-0">${actionHtml}</div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function buyOrUseItem(itemId) {
      const item = SHOP_ITEMS.find((x) => x.id === itemId);
      if (!item) return;

      if (item.type === 'food') {
        if (state.coins < item.price) {
          showToast('Pas assez de pièces pour cette friandise !', 'warn');
          return;
        }
        state.coins -= item.price;
        state.energy = Math.min(100, state.energy + (item.energyBoost || 20));
        grantXp(10);
        saveState();
        sfxSuccess();
        switchTab('sanctuary');
        triggerPetJoy(`Miam ! ${item.name} ! 😋`, item.emoji);
        return;
      }

      const owned = state.ownedItems.includes(item.id);
      if (!owned) {
        if (state.coins < item.price) {
          showToast('Pas assez de pièces !', 'warn');
          return;
        }
        state.coins -= item.price;
        state.ownedItems.push(item.id);
        sfxCoin();
      } else {
        sfxClick();
      }

      if (state.equippedItems.includes(item.id)) {
        state.equippedItems = state.equippedItems.filter((id) => id !== item.id);
      } else {
        state.equippedItems.push(item.id);
      }
      saveState();
      renderShop();
    }

    function buyHabitat(habId) {
      const hab = HABITAT_THEMES[habId];
      if (!hab) return;
      if (state.coins < hab.price) {
        showToast('Pas assez de pièces pour cet habitat !', 'warn');
        return;
      }
      state.coins -= hab.price;
      if (!state.ownedHabitats.includes(hab.id)) state.ownedHabitats.push(hab.id);
      state.habitat = hab.id;
      saveState();
      sfxVictory();
      switchTab('sanctuary');
      triggerPetJoy(`Bienvenue dans : ${hab.name} !`, hab.emoji);
    }

    function equipHabitat(habId) {
      if (!state.ownedHabitats.includes(habId)) return;
      const hab = HABITAT_THEMES[habId];
      state.habitat = habId;
      saveState();
      sfxClick();
      switchTab('sanctuary');
      triggerPetJoy(`${hab.name} installé !`, hab.emoji);
    }

    // =========================================================================
    // 9. INSTALLATION PWA, MENU SECRET & NAVIGATION
    // =========================================================================
    let deferredInstallPrompt = null;
    let secretTapCount = 0;
    let secretTapTimer = null;

    function initPWA() {
      try {
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');
        if (ctx) {
          const grad = ctx.createLinearGradient(0, 0, 512, 512);
          grad.addColorStop(0, '#1D4ED8');
          grad.addColorStop(1, '#4338CA');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.roundRect(0, 0, 512, 512, 110);
          ctx.fill();

          ctx.font = '250px serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('🦦', 256, 268);

          const iconDataUrl = canvas.toDataURL('image/png');
          const appleIcon = document.getElementById('apple-touch-icon');
          if (appleIcon) appleIcon.href = iconDataUrl;

          const manifestObj = {
            name: 'Rangement Quest',
            short_name: 'Rangement',
            description: 'Adopte ton compagnon et fais-le grandir en rangeant ta chambre !',
            start_url: window.location.href,
            display: 'standalone',
            background_color: '#090C10',
            theme_color: '#0D1117',
            orientation: 'portrait',
            icons: [
              { src: iconDataUrl, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
            ]
          };
          const manifestBlob = new Blob([JSON.stringify(manifestObj)], { type: 'application/manifest+json' });
          const manifestEl = document.getElementById('pwa-manifest');
          if (manifestEl) manifestEl.href = URL.createObjectURL(manifestBlob);
        }

        if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
          const swCode = `
            const CACHE = 'rangement-quest-v1';
            self.addEventListener('install', (e) => self.skipWaiting());
            self.addEventListener('activate', (e) => e.waitUntil(clients.claim()));
            self.addEventListener('fetch', (e) => {
              if (e.request.method !== 'GET') return;
              e.respondWith(
                caches.open(CACHE).then((cache) =>
                  fetch(e.request).then((res) => {
                    if (res && res.status === 200) cache.put(e.request, res.clone());
                    return res;
                  }).catch(() => cache.match(e.request))
                )
              );
            });
          `;
          const swBlob = new Blob([swCode], { type: 'application/javascript' });
          navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
        }
      } catch (e) {}
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredInstallPrompt = e;
    });

    function triggerNativeInstall() {
      if (deferredInstallPrompt) {
        deferredInstallPrompt.prompt();
        deferredInstallPrompt.userChoice.finally(() => {
          deferredInstallPrompt = null;
          closeModal();
        });
      }
    }

    function openInstallModal() {
      sfxClick();
      const canPrompt = Boolean(deferredInstallPrompt);
      openModal(`
        <div class="flex items-center justify-between">
          <h3 class="text-base font-extrabold text-white">📲 Installer sur le téléphone</h3>
          <button onclick="closeModal()" class="text-slate-400 hover:text-white text-sm font-bold">✕</button>
        </div>
        <p class="text-xs text-slate-300 leading-relaxed">
          Chaque téléphone garde sa propre sauvegarde indépendante avec son propre animal !
        </p>
        ${canPrompt ? `
          <button onclick="triggerNativeInstall()" class="w-full py-3 rounded-2xl bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold text-xs shadow-lg">
            Installer l’application maintenant ✨
          </button>
        ` : ''}
        <div class="space-y-2.5 text-xs text-slate-300 bg-[#0D1117] p-3.5 rounded-2xl border border-white/10">
          <div>
            <span class="font-bold text-emerald-300">📱 Sur Android (Chrome) :</span>
            <p class="text-slate-400 mt-0.5">Appuie sur les <b>3 points (⋮)</b> en haut à droite → <b>« Ajouter à l’écran d’accueil »</b> ou <b>« Installer l’application »</b>.</p>
          </div>
          <div class="pt-2 border-t border-white/5">
            <span class="font-bold text-sky-300">🍎 Sur iPhone / iPad (Safari) :</span>
            <p class="text-slate-400 mt-0.5">Appuie sur le bouton <b>Partager (⬆️)</b> en bas → <b>« Sur l’écran d’accueil »</b>.</p>
          </div>
        </div>
      `);
    }

    function handleSecretTap() {
      secretTapCount += 1;
      clearTimeout(secretTapTimer);
      secretTapTimer = setTimeout(() => { secretTapCount = 0; }, 1500);
      if (secretTapCount >= 5) {
        secretTapCount = 0;
        openDemoModal();
      }
    }

    function openDemoModal() {
      sfxClick();
      openModal(`
        <div class="flex items-center justify-between">
          <h3 class="text-base font-extrabold text-white">⚙️ Outils Parent / Test</h3>
          <button onclick="closeModal()" class="text-slate-400 hover:text-white text-sm font-bold">✕</button>
        </div>
        <p class="text-xs text-slate-400">Outils cachés (5 appuis sur le titre) pour tester ou réinitialiser.</p>
        <div class="space-y-2">
          <button onclick="demoAddCoins()" class="w-full py-2.5 px-3 rounded-xl bg-amber-500/15 hover:bg-amber-500/25 border border-amber-500/30 text-amber-200 text-xs font-bold text-left">
            🪙 Ajouter +100 pièces
          </button>
          <button onclick="demoAddXp()" class="w-full py-2.5 px-3 rounded-xl bg-blue-500/15 hover:bg-blue-500/25 border border-blue-500/30 text-blue-200 text-xs font-bold text-left">
            🌱 Ajouter +130 XP (faire grandir)
          </button>
          <button onclick="demoSimulate48h()" class="w-full py-2.5 px-3 rounded-xl bg-purple-500/15 hover:bg-purple-500/25 border border-purple-500/30 text-purple-200 text-xs font-bold text-left">
            😴 Simuler 48h sans visite (-20% énergie)
          </button>
          <button onclick="demoResetAll()" class="w-full py-2.5 px-3 rounded-xl bg-rose-500/15 hover:bg-rose-500/25 border border-rose-500/30 text-rose-200 text-xs font-bold text-left">
            🔄 Réinitialiser la partie (changer d'animal)
          </button>
        </div>
      `);
    }

    function demoAddCoins() {
      sfxCoin();
      state.coins += 100;
      saveState();
      closeModal();
      showToast('+100 pièces ajoutées !', 'success');
      renderCurrentView();
    }

    function demoAddXp() {
      sfxVictory();
      grantXp(130);
      saveState();
      closeModal();
      renderCurrentView();
    }

    function demoSimulate48h() {
      state.lastActiveAt = Date.now() - (2 * DAY_MS + 1000);
      applyInactivityDecay(false);
      closeModal();
      renderCurrentView();
    }

    function demoResetAll() {
      stopChallengeTimer();
      activeChallenge = null;
      state = getDefaultState();
      saveState();
      closeModal();
      showToast('Partie réinitialisée.', 'info');
      renderOnboarding();
    }

    function switchTab(tabName) {
      sfxClick();
      currentTab = tabName;

      document.querySelectorAll('.nav-btn').forEach((btn) => {
        btn.classList.remove('text-blue-400');
        btn.classList.add('text-slate-400');
      });
      const activeBtn = document.getElementById(`nav-${tabName}`);
      if (activeBtn) {
        activeBtn.classList.remove('text-slate-400');
        activeBtn.classList.add('text-blue-400');
      }

      renderCurrentView();
    }

    function renderCurrentView() {
      if (!state.adopted) {
        renderOnboarding();
        return;
      }
      if (currentTab === 'sanctuary') renderSanctuary();
      else if (currentTab === 'challenges') renderChallenges();
      else if (currentTab === 'shop') renderShop();
    }

    window.addEventListener('DOMContentLoaded', () => {
      initPWA();
      updateSoundIcon();
      applyInactivityDecay(false);
      renderCurrentView();
    });
  </script>
</body>
</html>
