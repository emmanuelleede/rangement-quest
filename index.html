    * {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #090C10;
      color: #F8FAFC;
      margin: 0;
      padding: 0;
    }

    @keyframes petBreathe {
      0%, 100% { transform: scale(1) translateY(0); }
      50% { transform: scale(1.035) translateY(-4px); }
    }
    .anim-breathe {
      animation: petBreathe 3.2s ease-in-out infinite;
    }

    @keyframes petTiredBreathe {
      0%, 100% { transform: scale(0.98) translateY(2px); filter: saturate(0.75) brightness(0.9); }
      50% { transform: scale(1.00) translateY(4px); filter: saturate(0.75) brightness(0.9); }
    }
    .anim-tired {
      animation: petTiredBreathe 4.5s ease-in-out infinite;
    }

    @keyframes petBounce {
      0%, 100% { transform: scale(1) rotate(0deg); }
      25% { transform: scale(1.1) translateY(-10px) rotate(-3deg); }
      50% { transform: scale(1.05) translateY(-4px) rotate(3deg); }
      75% { transform: scale(1.08) translateY(-8px) rotate(-2deg); }
    }
    .anim-bounce {
      animation: petBounce 0.65s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }

    @keyframes sparkleFloat {
      0%, 100% { opacity: 0.25; transform: translateY(0) scale(0.8); }
      50% { opacity: 0.95; transform: translateY(-10px) scale(1.15); }
    }
    .sparkle-dot {
      animation: sparkleFloat 2.8s ease-in-out infinite;
    }

    @keyframes floatUpFade {
      0% { opacity: 1; transform: translateY(0) scale(0.8); }
      100% { opacity: 0; transform: translateY(-48px) scale(1.35); }
    }
    .floating-particle {
      animation: floatUpFade 0.9s ease-out forwards;
      pointer-events: none;
    }

    ::-webkit-scrollbar-track { background: #0D1117; }
    ::-webkit-scrollbar-thumb { background: #232D3F; border-radius: 4px; }

    // 1. MOTEUR SONORE (WEB AUDIO API)
    // =========================================================================
    let soundEnabled = true;
    let audioCtx = null;

    function getAudioContext() {
      try {
        if (!audioCtx && (window.AudioContext || window.webkitAudioContext)) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          audioCtx = new Ctx();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume().catch(() => {});
        }
      } catch (e) {}
      return audioCtx;
    }

    function playTone(freq, duration = 0.12, type = 'sine', gainVal = 0.08, delay = 0) {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime + delay);
        gain.gain.setValueAtTime(gainVal, ctx.currentTime + delay);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime + delay);
        osc.stop(ctx.currentTime + delay + duration);
      } catch (e) {}
    }

    function updateSoundIcon() {
      const onIcon = document.getElementById('icon-sound-on');
      const offIcon = document.getElementById('icon-sound-off');
      if (!onIcon || !offIcon) return;
      if (soundEnabled) {
        onIcon.classList.remove('hidden');
        offIcon.classList.add('hidden');
      } else {
        onIcon.classList.add('hidden');
        offIcon.classList.remove('hidden');
      }
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      updateSoundIcon();
      if (soundEnabled) sfxClick();
    }

    function sfxClick() { playTone(520, 0.07, 'sine', 0.06); }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return getDefaultState();
        const parsed = JSON.parse(raw);
        const merged = {
          ...getDefaultState(),
          ...parsed,
          challengeRecords: parsed && typeof parsed.challengeRecords === 'object' && parsed.challengeRecords !== null
            ? parsed.challengeRecords
            : {},
          equippedSlots: Array.isArray(parsed.equippedSlots) && parsed.equippedSlots.length === 4
            ? parsed.equippedSlots
            : [null, null, null, null]
        };
        if (!HABITAT_THEMES[merged.equippedHabitat]) {
          merged.equippedHabitat = 'none';
        }
        return merged;
      } catch (e) {
        return getDefaultState();
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
    }

    let state = loadState();

    function applyInactivityDecay(silent = false) {
      if (!state.adopted) {
        state.lastActiveAt = Date.now();
        saveState();
        return;
      }
      const now = Date.now();
      const last = state.lastActiveAt || now;
      const elapsed = now - last;
      const daysPassed = Math.floor(elapsed / DAY_MS);

      if (daysPassed >= 1) {
        const loss = daysPassed * 10;
        const oldEnergy = state.energy;
        state.energy = Math.max(10, state.energy - loss);
        state.lastActiveAt = last + daysPassed * DAY_MS;
        saveState();
        if (!silent && state.energy < oldEnergy) {
          showToast(`😴 ${daysPassed} jour(s) sans visite : énergie -${oldEnergy - state.energy}%`, 'info');
        }
      } else {
        state.lastActiveAt = now;
        saveState();
      }
    }

    // =========================================================================

    // =========================================================================
    function getStageIndexFromXp(xp) {
      let idx = 0;
      for (let i = 0; i < EVOLUTION_STAGES.length; i++) {
        if (xp >= EVOLUTION_STAGES[i].minXp) {
          idx = i;
        }
      }
      return idx;
    }

    function getStageInfoFromXp(xp) {
      const idx = getStageIndexFromXp(xp);
      const current = EVOLUTION_STAGES[idx] || EVOLUTION_STAGES[0];
      const next = EVOLUTION_STAGES[idx + 1] || null;
      return {
        index: idx,
        current,
        next,
        isMax: !next
      };
    }

    function getCurrentEra() {
      return getStageInfoFromXp(state.xp).current.era;
    }

    function grantXp(amount) {
      const prevStage = getStageInfoFromXp(state.xp);
      state.xp += amount;
      const newStage = getStageInfoFromXp(state.xp);

      if (newStage.index > prevStage.index) {
        state.equippedSlots = [null, null, null, null];
        state.lastEra = newStage.current.era;
        showToast(`🎉 ${state.petName} devient ${newStage.current.label} ! Nouveaux objets en boutique !`, 'success');
      }
    }

    function getLocalPetImageCandidates(speciesId, xp = 0) {
      const cfg = SPECIES_VISUAL_CONFIG[speciesId] || SPECIES_VISUAL_CONFIG.loutre;
      const stageIndex = getStageIndexFromXp(xp);
      const candidates = [];

      if (Array.isArray(cfg.localStageImages) && cfg.localStageImages[stageIndex]) {
        candidates.push(cfg.localStageImages[stageIndex]);
      }
      if (Array.isArray(cfg.localStageImages)) {
        cfg.localStageImages.forEach((imgPath) => {
          if (imgPath && !candidates.includes(imgPath)) {
            candidates.push(imgPath);
          }
        });
      }
      if (cfg.localFallback && !candidates.includes(cfg.localFallback)) {
        candidates.push(cfg.localFallback);
      }
      return candidates;
    }

    function renderLocalImageWithFallback(candidates, altText, extraClasses, styleAttr, fallbackHtml) {
      const cleanList = (Array.isArray(candidates) ? candidates : [candidates]).filter(Boolean);
      if (!cleanList.length) {
        return fallbackHtml;
      }

      const encodedList = encodeURIComponent(JSON.stringify(cleanList));
      const firstSrc = cleanList[0];

      return `
        <img
          src="${firstSrc}"
          alt="${altText}"
          data-candidates="${encodedList}"
          data-candidate-index="0"
          class="${extraClasses || ''}"
          style="${styleAttr || ''}"
          onerror="handleLocalImageError(this)"
        />
        <div class="local-img-fallback hidden w-full h-full">${fallbackHtml}</div>
      `;
    }

    window.handleLocalImageError = function (imgEl) {
      try {
        const rawList = imgEl.getAttribute('data-candidates');
        const currentIdx = parseInt(imgEl.getAttribute('data-candidate-index') || '0', 10);
        const candidates = rawList ? JSON.parse(decodeURIComponent(rawList)) : [];
        const nextIdx = currentIdx + 1;

        if (nextIdx < candidates.length) {
          imgEl.setAttribute('data-candidate-index', String(nextIdx));
          imgEl.src = candidates[nextIdx];
          return;
        }
      } catch (e) {}

      imgEl.classList.add('hidden');
      const fallbackEl = imgEl.parentElement && imgEl.parentElement.querySelector('.local-img-fallback');
      if (fallbackEl) {
        fallbackEl.classList.remove('hidden');
      }
    };

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const colorMap = {
        success: 'bg-emerald-950/95 border-emerald-500/40 text-emerald-200',
        warning: 'bg-amber-950/95 border-amber-500/40 text-amber-200',
        info: 'bg-[#151B26]/95 border-blue-500/40 text-slate-100'
      };

      const toast = document.createElement('div');
      toast.className = `px-4 py-2.5 rounded-2xl border backdrop-blur-md text-xs font-semibold shadow-xl transition-all duration-300 text-center ${colorMap[type] || colorMap.info}`;
      toast.textContent = message;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-8px)';
        setTimeout(() => toast.remove(), 300);
      }, 2600);
    }

      box.innerHTML = innerHtml;
      overlay.classList.remove('hidden');
      overlay.classList.add('flex');
    }

    function closeModal() {

      overlay.classList.add('hidden');

    function selectOnboardingSpecies(speciesId) {
      sfxClick();
      selectedSpecies = speciesId;
      renderOnboarding();
    }

    function confirmAdoption() {
      const input = document.getElementById('pet-name-input');
      const spec = SPECIES_DATA[selectedSpecies] || SPECIES_DATA.loutre;
      const chosenName = (input && input.value.trim()) ? input.value.trim() : spec.defaultPetName;

      state = {
        ...getDefaultState(),
        adopted: true,
        species: selectedSpecies,
        petName: chosenName,
        lastActiveAt: Date.now()
      };
      saveState();
      sfxVictory();
      showToast(`🎉 ${chosenName} rejoint ton sanctuaire !`, 'success');
      switchTab('sanctuary');
    }

    // =========================================================================
    // 7. ONGLET COMPAGNON (SANCTUAIRE SANS SUPERPOSITION)
    // =========================================================================
    function renderSanctuary() {
      const nav = document.getElementById('bottom-nav');
      if (nav) nav.classList.remove('hidden');

      const main = document.getElementById('main-content');
      const spec = SPECIES_DATA[state.species] || SPECIES_DATA.loutre;
      const stageInfo = getStageInfoFromXp(state.xp);
      const hab = HABITAT_THEMES[state.equippedHabitat] || HABITAT_THEMES.none;
      const era = getCurrentEra();

      let xpProgressPct = 100;
      let xpProgressText = `${state.xp} XP (Stade Max)`;
      if (!stageInfo.isMax) {
        const span = stageInfo.next.minXp - stageInfo.current.minXp;
        const done = state.xp - stageInfo.current.minXp;
        xpProgressPct = Math.min(100, Math.max(0, Math.round((done / span) * 100)));
        xpProgressText = `${state.xp} / ${stageInfo.next.minXp} XP`;
      }

      const energyColor = state.energy >= 50
        ? 'bg-emerald-500'
        : (state.energy >= 25 ? 'bg-amber-500' : 'bg-rose-500');

      const quickFoodByEra = {
        newborn: { id: 'nb_milk', icon: '🥛', label: 'Lait', price: 15, energy: 15, xp: 5 },
        baby: { id: 'baby_strawberry', icon: '🍓', label: 'Fraises', price: 18, energy: 15, xp: 8 },
        junior: { id: 'jun_apple', icon: '🍎', label: 'Pomme', price: 20, energy: 15, xp: 10 },

      const topDecorHtml = (hab.decorTop && hab.decorTop.length)

      const bottomDecorHtml = (hab.decorBottom && hab.decorBottom.length)
        ? `<div class="flex items-center gap-2 text-xs opacity-90 select-none pointer-events-none">${hab.decorBottom.map((d) => `<span>${d}</span>`).join('')}</div>`
        : '';

      main.innerHTML = `
        <div class="p-4 space-y-4">

              <div class="text-sm font-extrabold text-blue-300 mt-0.5">${stageInfo.current.label}</div>

              <div class="text-sm font-extrabold text-emerald-300 mt-0.5">🏆 ${state.totalChallenges}</div>
            </div>
          </div>

          <div id="pet-stage-card" class="relative rounded-3xl border ${hab.borderClass || 'border-[#253044]'} overflow-hidden shadow-xl transition-all duration-500">
            ${buildHabitatBackdropHTML(state.equippedHabitat)}

            <div class="relative z-10 p-4 flex flex-col gap-3">
              <div class="flex items-start justify-between gap-2">
                <div class="min-w-0 flex items-center gap-1.5">
                  <div class="min-w-0">
                    <div class="flex items-center gap-1.5">
                      <h2 class="text-lg font-extrabold text-white leading-tight truncate">${state.petName}</h2>
                      <button onclick="openRenamePetModal()" title="Changer le prénom" class="shrink-0 w-6 h-6 rounded-lg bg-slate-950/60 hover:bg-slate-900/90 border border-white/15 text-slate-200 text-[11px] flex items-center justify-center transition active:scale-95">
                        ✏️
                      </button>
                    </div>
                    <p class="text-xs text-slate-300 font-medium">${spec.name} · Niv. ${stageInfo.current.level} (${stageInfo.current.label})</p>
                  </div>
                </div>

                <button onclick="petCompanion(event)" class="shrink-0 px-3 py-1.5 rounded-full bg-pink-500/25 hover:bg-pink-500/35 border border-pink-400/40 text-pink-200 text-xs font-bold flex items-center gap-1.5 transition active:scale-95">
                  <span>💖</span><span>Caresser</span>
                </button>
              </div>

              ${topDecorHtml}

              <div class="grid grid-cols-[56px_1fr_56px] items-center gap-2 py-1">
                <div class="flex flex-col items-center gap-3">
                  ${renderAccessorySlotHTML(0)}
                  ${renderAccessorySlotHTML(1)}
                </div>

                <div class="flex items-center justify-center min-h-[168px]">
                  ${buildPetArtHTML(state.species, {
                    size: 'lg',
                    xp: state.xp,
                    energy: state.energy,
                    showSparkles: true,
                    eatingItem: eatingPreviewItem
                  })}
                </div>

                <div class="flex flex-col items-center gap-3">
                  ${renderAccessorySlotHTML(2)}
                  ${renderAccessorySlotHTML(3)}
                </div>
              </div>

              <div class="flex items-center justify-between px-3 py-1.5 rounded-xl bg-slate-950/65 border border-white/10 backdrop-blur-sm">
                <div class="flex items-center gap-1.5 min-w-0">
                  <span class="text-xs">${hab.badgeIcon}</span>
                  <span class="text-[11px] font-semibold text-slate-200 truncate">${hab.name}</span>
                </div>
                ${bottomDecorHtml}
              </div>

              <div class="grid grid-cols-2 gap-2.5 pt-0.5">
                <button onclick="quickFeed()" class="py-2.5 px-3 rounded-2xl bg-amber-500/20 hover:bg-amber-500/30 border border-amber-400/35 text-amber-200 text-xs font-bold flex items-center justify-center gap-1.5 transition active:scale-95">
                  <span>${quickFood.icon}</span>
                  <span>${quickFood.label} (${quickFood.price} 🪙)</span>
                </button>

                <button onclick="switchTab('challenges')" class="py-2.5 px-3 rounded-2xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold flex items-center justify-center gap-1.5 shadow-lg shadow-blue-600/25 transition active:scale-95">
                  <span>⚡</span>
                  <span>Lancer un défi</span>
                </button>
              </div>
            </div>
          </div>

          <!-- Progression de vie & Bien-être -->
          <div class="bg-[#151B26] border border-[#232D3F] rounded-3xl p-4 space-y-3.5">
            <div class="space-y-1.5">
              <div class="flex justify-between items-center text-xs">
                <span class="font-semibold text-slate-200 flex items-center gap-1.5"><span>🌱</span> Progression de vie (${stageInfo.current.label})</span>
                <span class="font-bold text-blue-300">${xpProgressText}</span>
              </div>
              <div class="w-full h-2.5 bg-[#0D1117] rounded-full overflow-hidden border border-white/5">
                <div class="h-full bg-gradient-to-r from-blue-500 to-indigo-500 rounded-full transition-all duration-500" style="width: ${xpProgressPct}%"></div>
              </div>
              <p class="text-[11px] text-slate-400">
                ${stageInfo.isMax ? `${state.petName} a atteint son stade Adulte.` : `Prochaine étape : ${stageInfo.next.label} à ${stageInfo.next.minXp} XP.`}

              </div>
              <div class="w-full h-2.5 bg-[#0D1117] rounded-full overflow-hidden border border-white/5">
                <div class="h-full ${energyColor} rounded-full transition-all duration-500" style="width: ${state.energy}%"></div>
              </div>
              <p class="text-[11px] text-slate-400">Caresse-le, donne-lui une friandise ou réussis des défis pour garder son bien-être au top.</p>

          <!-- Actions Compagnon -->
          <div class="pt-1 flex flex-wrap justify-center gap-2">
            <button onclick="openRenamePetModal()" class="px-3.5 py-2 rounded-xl bg-[#151B26] hover:bg-[#1E2634] border border-[#232D3F] text-slate-300 hover:text-white text-xs font-semibold transition flex items-center gap-1.5">
              <span>✏️</span>
              <span>Changer le prénom</span>
            </button>
            <button onclick="openResetPetModal()" class="px-3.5 py-2 rounded-xl bg-[#151B26] hover:bg-[#1E2634] border border-[#232D3F] text-slate-400 hover:text-slate-200 text-xs font-semibold transition flex items-center gap-1.5">
              <span>🔄</span>
              <span>Changer d'animal</span>
            </button>
          </div>

        </div>
      `;
    }

    function spawnJoyParticles() {
      const card = document.getElementById('pet-stage-card');
      if (!card) return;
      const icons = ['💖', '✨', '😋', '💛'];
      icons.forEach((sym, i) => {
        const p = document.createElement('div');
        p.className = 'floating-particle absolute z-30 text-xl';
        p.style.left = `${36 + i * 9}%`;
        p.style.top = `${42 + (i % 2) * 8}%`;
        p.style.animationDelay = `${i * 0.08}s`;
        p.textContent = sym;
        card.appendChild(p);
        setTimeout(() => p.remove(), 1100);
      });
    }

    function petCompanion(event) {
      sfxPet();
      state.energy = Math.min(100, state.energy + 3);
      state.lastActiveAt = Date.now();
      saveState();

      renderSanctuary();
      spawnJoyParticles();
    }

    function quickFeed() {
      const era = getCurrentEra();
      const quickFoodByEra = {
        newborn: { id: 'nb_milk', name: 'Lait Chaud Étoilé', icon: '🥛', price: 15, effectEnergy: 15, effectXp: 5 },
        baby: { id: 'baby_strawberry', name: 'Fraises des Bois', icon: '🍓', price: 18, effectEnergy: 15, effectXp: 8 },
        junior: { id: 'jun_apple', name: 'Pomme Croquante', icon: '🍎', price: 20, effectEnergy: 15, effectXp: 10 },
        adult: { id: 'adu_peach', name: 'Pêche Solaire', icon: '🍑', price: 25, effectEnergy: 20, effectXp: 12 }
      };
      const food = quickFoodByEra[era] || quickFoodByEra.newborn;

      if (state.coins < food.price) {
        showToast(`Pas assez de pièces (${food.price} 🪙 requis).`, 'warning');
        return;
      }

      sfxCoin();
      state.coins -= food.price;
      state.energy = Math.min(100, state.energy + food.effectEnergy);
      state.lastActiveAt = Date.now();
      grantXp(food.effectXp);
      saveState();

      eatingPreviewItem = food;
      renderSanctuary();
      spawnJoyParticles();
      setTimeout(() => {
        eatingPreviewItem = null;
        if (currentTab === 'sanctuary') renderSanctuary();
      }, 1700);
    }

    function openSlotPicker(slotIndex) {
      sfxClick();
      shopCategory = 'accessory';
      switchTab('shop');
      showToast(`Choisis un accessoire pour remplir la case #${slotIndex + 1} !`, 'info');
    }

    function interactWithSlot(slotIndex) {
      const itemId = state.equippedSlots[slotIndex];
      const item = SHOP_ITEMS.find((i) => i.id === itemId);
      if (!item) return;

      sfxPet();
      state.energy = Math.min(100, state.energy + 2);
      state.lastActiveAt = Date.now();
      saveState();
      showToast(`${item.icon} ${state.petName} joue avec : ${item.name} (+2% énergie)`, 'success');
      renderSanctuary();
    }

    // =========================================================================
    // 8. ONGLET DÉFIS & CHRONOMÈTRES (AVEC DÉFIS SANS CHRONO & RESET RECORDS)
    // =========================================================================
    let selectedDifficulty = 'easy';

    function stopChallengeTimer() {
      if (challengeTimerInterval) {
        clearInterval(challengeTimerInterval);
        challengeTimerInterval = null;
      }
    }

    function renderChallenges() {
      const nav = document.getElementById('bottom-nav');
      if (nav) nav.classList.remove('hidden');

      const main = document.getElementById('main-content');
      if (!main) return;

      if (activeChallenge) {
        if (activeChallenge.noTimer) {
          const elapsedNoTimer = Math.max(0, Math.floor((Date.now() - (activeChallenge.startedAt || Date.now())) / 1000));
          main.innerHTML = `
            <div class="p-4 space-y-4 flex-1 flex flex-col justify-between">
              <div class="bg-[#151B26] border border-[#232D3F] rounded-3xl p-5 text-center space-y-4">
                <span class="inline-block px-3 py-1 rounded-full bg-emerald-500/15 border border-emerald-500/30 text-emerald-300 text-xs font-bold">
                  Défi sans chrono
                </span>
                <h2 class="text-xl font-extrabold text-white">${activeChallenge.title}</h2>
                <p class="text-xs text-slate-300 max-w-xs mx-auto">${activeChallenge.desc}</p>

                <div class="py-4">
                  <div class="text-3xl font-extrabold text-blue-300">🌿 À ton rythme</div>
                  <div class="text-[11px] font-semibold text-slate-400 mt-1.5">
                    Pas de compte à rebours ni de record de vitesse sur cette mission.
                  </div>
                </div>

                <div class="text-xs text-slate-400">
                  Récompense : <span class="text-amber-300 font-bold">+${activeChallenge.rewardCoins} 🪙</span> · <span class="text-blue-300 font-bold">+${activeChallenge.rewardXp} XP</span>
                </div>
              </div>

              <div class="space-y-2.5">
                <button onclick="completeActiveChallenge()" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-500 text-slate-950 font-extrabold text-sm shadow-lg shadow-emerald-500/25 transition active:scale-95">
                  Mission terminée ! Valider 🎉
                </button>
                <button onclick="cancelActiveChallenge()" class="w-full py-2.5 rounded-2xl bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/30 text-rose-300 text-xs font-bold transition">
                  Abandonner le défi
                </button>
              </div>
            </div>
          `;
          return;
        }

        const isDone = activeChallenge.remaining <= 0;
        const elapsedSeconds = Math.max(1, activeChallenge.total - activeChallenge.remaining);
        const pct = Math.min(100, Math.max(0, Math.round((elapsedSeconds / activeChallenge.total) * 100)));
        const currentBest = state.challengeRecords && typeof state.challengeRecords[activeChallenge.id] === 'number'
          ? state.challengeRecords[activeChallenge.id]
          : null;

        main.innerHTML = `
          <div class="p-4 space-y-4 flex-1 flex flex-col justify-between">
            <div class="bg-[#151B26] border border-[#232D3F] rounded-3xl p-5 text-center space-y-4">
              <span class="inline-block px-3 py-1 rounded-full bg-blue-500/15 border border-blue-500/30 text-blue-300 text-xs font-bold">
                Défi en cours
              </span>
              <h2 class="text-xl font-extrabold text-white">${activeChallenge.title}</h2>
              <p class="text-xs text-slate-300 max-w-xs mx-auto">${activeChallenge.desc}</p>

              <div class="py-4">
                <div class="text-5xl font-extrabold tracking-tight ${isDone ? 'text-emerald-400' : 'text-white'}">
                  ${activeChallenge.remaining}s
                </div>
                <div class="text-[11px] font-semibold text-slate-400 mt-1.5">
                  Temps écoulé : <span class="text-slate-200">${elapsedSeconds}s</span> / ${activeChallenge.total}s${currentBest !== null ? ` · Record : <span class="text-amber-300">${currentBest}s</span>` : ''}
                </div>
                <div class="w-full h-3 bg-[#0D1117] rounded-full overflow-hidden border border-white/10 mt-3">
                  <div class="h-full ${isDone ? 'bg-emerald-500' : 'bg-blue-500'} transition-all duration-300" style="width: ${pct}%"></div>
                </div>
              </div>

              <div class="text-xs text-slate-400">
                Récompense : <span class="text-amber-300 font-bold">+${activeChallenge.rewardCoins} 🪙</span> · <span class="text-blue-300 font-bold">+${activeChallenge.rewardXp} XP</span>
              </div>
            </div>

            <div class="space-y-2.5">
              <button onclick="completeActiveChallenge()" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-500 text-slate-950 font-extrabold text-sm shadow-lg shadow-emerald-500/25 transition active:scale-95">
                ${isDone ? 'Valider et récupérer les récompenses 🎉' : `J'ai fini ! Valider en ${elapsedSeconds}s ⚡`}
              </button>
              <button onclick="cancelActiveChallenge()" class="w-full py-2.5 rounded-2xl bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/30 text-rose-300 text-xs font-bold transition">
                Abandonner le défi
              </button>
            </div>
          </div>
        `;
        return;
      }

      const filteredChallenges = CONSTRAINT_CHALLENGES.filter((c) => c.difficulty === selectedDifficulty);
      const hasAnyRecord = state.challengeRecords && Object.keys(state.challengeRecords).length > 0;

      main.innerHTML = `
        <div class="p-4 space-y-4">
          <div class="flex items-center justify-between">
            <div>
              <h2 class="text-lg font-extrabold text-white">Défis de Rangement</h2>
              <p class="text-[11px] text-slate-400">Valide dès que tu as fini pour battre ton record</p>
            </div>
            <div class="px-3 py-1.5 rounded-full bg-emerald-500/15 border border-emerald-500/30 text-emerald-300 text-xs font-extrabold">
              🏆 ${state.totalChallenges}
            </div>
          </div>

          <div class="grid grid-cols-3 gap-2 bg-[#151B26] p-1.5 rounded-2xl border border-[#232D3F]">
            ${['easy', 'medium', 'hard'].map((diff) => {
              const meta = DIFFICULTY_META[diff];
              const isSel = selectedDifficulty === diff;
              return `
                <button onclick="setChallengeDifficulty('${diff}')" class="py-2 rounded-xl text-xs font-bold transition ${isSel ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white'}">
                  ${meta.icon} ${meta.label}
                </button>
              `;
            }).join('')}
          </div>

          <div class="space-y-2.5">
            ${filteredChallenges.map((ch) => {
              const meta = DIFFICULTY_META[ch.difficulty];
              const isNoTimer = Boolean(ch.noTimer);
              const bestSec = !isNoTimer && state.challengeRecords && typeof state.challengeRecords[ch.id] === 'number'
                ? state.challengeRecords[ch.id]
                : null;
              return `
                <div class="bg-[#151B26] border border-[#232D3F] rounded-2xl p-4 space-y-3">
                  <div class="flex items-start justify-between gap-2">
                    <div>
                      <div class="flex flex-wrap items-center gap-1.5">
                        <span class="inline-block px-2 py-0.5 rounded-full border text-[10px] font-bold ${meta.badgeClass}">
                          ${meta.icon} ${meta.label} · ${isNoTimer ? 'Sans chrono' : `${ch.minSeconds}s max`}
                        </span>
                        ${bestSec !== null ? `
                          <span class="inline-block px-2 py-0.5 rounded-full bg-amber-500/15 border border-amber-500/30 text-amber-300 text-[10px] font-bold">
                            🏅 Record : ${bestSec}s
                          </span>
                        ` : ''}
                      </div>
                      <h3 class="text-sm font-bold text-white mt-1.5">${ch.title}</h3>
                      <p class="text-xs text-slate-400 mt-0.5">${ch.desc}</p>

                  <div class="flex items-center justify-between pt-2 border-t border-white/5">
                    <span class="text-xs font-bold text-amber-300">+${ch.rewardCoins} 🪙 · +${ch.rewardXp} XP</span>
                    <button onclick="startConstraintChallenge('${ch.id}')" class="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold transition active:scale-95">
                      ${isNoTimer ? 'Commencer ✨' : 'Démarrer ⚡'}
                    </button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>

          <div class="pt-1 flex justify-center">
            <button onclick="openResetRecordsModal()" ${hasAnyRecord ? '' : 'disabled'} class="px-3.5 py-2 rounded-xl bg-[#151B26] hover:bg-[#1E2634] disabled:opacity-45 disabled:pointer-events-none border border-[#232D3F] text-slate-400 hover:text-slate-200 text-xs font-semibold transition flex items-center gap-1.5">
              <span>🏅</span>
              <span>Réinitialiser les records</span>
            </button>
          </div>
        </div>
      `;
    }

    function setChallengeDifficulty(diff) {
      sfxClick();
      selectedDifficulty = diff;
      renderChallenges();
    }

    function startConstraintChallenge(challengeId) {
      const ch = CONSTRAINT_CHALLENGES.find((c) => c.id === challengeId);
      if (!ch) return;

      sfxClick();
      stopChallengeTimer();

      if (ch.noTimer) {
        activeChallenge = {
          ...ch,
          noTimer: true,
          total: 0,
          remaining: 0,
          startedAt: Date.now()
        };
        renderChallenges();
        return;
      }

      activeChallenge = {
        ...ch,
        noTimer: false,
        total: ch.minSeconds,
        remaining: ch.minSeconds
      };

      challengeTimerInterval = setInterval(() => {
        if (!activeChallenge) {
          stopChallengeTimer();
          return;
        }
        activeChallenge.remaining -= 1;
        if (activeChallenge.remaining <= 5 && activeChallenge.remaining > 0) {
          sfxTick();
        }
        if (activeChallenge.remaining <= 0) {
          activeChallenge.remaining = 0;
          stopChallengeTimer();
          sfxVictory();
        }
        if (currentTab === 'challenges') renderChallenges();
      }, 1000);

      renderChallenges();
    }

    function cancelActiveChallenge() {
      sfxClick();
      stopChallengeTimer();
      activeChallenge = null;
      renderChallenges();
    }

    function completeActiveChallenge() {
      if (!activeChallenge) return;
      const ch = activeChallenge;
      const isNoTimer = Boolean(ch.noTimer);
      const elapsedSeconds = Math.max(1, ch.total - ch.remaining);
      stopChallengeTimer();
      activeChallenge = null;

      let isNewRecord = false;
      if (!isNoTimer) {
        if (!state.challengeRecords || typeof state.challengeRecords !== 'object') {
          state.challengeRecords = {};
        }
        const prevRecord = typeof state.challengeRecords[ch.id] === 'number' ? state.challengeRecords[ch.id] : null;
        isNewRecord = prevRecord === null || elapsedSeconds < prevRecord;
        if (isNewRecord) {
          state.challengeRecords[ch.id] = elapsedSeconds;
        }
      }

      sfxVictory();
      state.coins += ch.rewardCoins;
      state.totalChallenges += 1;
      state.energy = Math.min(100, state.energy + 10);
      state.lastActiveAt = Date.now();
      grantXp(ch.rewardXp);
      saveState();

      const recordMsg = isNoTimer
        ? ''
        : (isNewRecord ? ` · 🏅 Nouveau record : ${elapsedSeconds}s !` : ` (${elapsedSeconds}s)`);
      showToast(`🏆 Défi réussi ! +${ch.rewardCoins} 🪙 et +${ch.rewardXp} XP${recordMsg}`, 'success');
      switchTab('sanctuary');
      spawnJoyParticles();
    }

    function openResetRecordsModal() {
      sfxClick();
      openModal(`
        <div class="flex items-center justify-between">
          <h3 class="text-base font-extrabold text-white">🏅 Réinitialiser les records</h3>
          <button onclick="closeModal()" class="text-slate-400 hover:text-white text-sm font-bold">✕</button>
        </div>
        <p class="text-xs text-slate-300 leading-relaxed">
          Veux-tu effacer tous les meilleurs temps enregistrés sur les défis ? Les pièces, l'XP et le compagnon ne changent pas.
        </p>
        <div class="grid grid-cols-2 gap-2.5 pt-1">
          <button onclick="closeModal()" class="py-2.5 px-3 rounded-xl bg-[#1E2634] hover:bg-[#283346] text-slate-200 text-xs font-bold transition">
            Annuler
          </button>
          <button onclick="confirmResetRecords()" class="py-2.5 px-3 rounded-xl bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold transition">
            Effacer les records
          </button>
        </div>
      `);
    }

    function confirmResetRecords() {
      sfxClick();
      state.challengeRecords = {};
      saveState();
      closeModal();
      showToast('🏅 Tous les records de défis ont été réinitialisés.', 'info');
      renderChallenges();
    }

    // =========================================================================
    // 9. ONGLET BOUTIQUE (ADAPTÉE À CHAQUE STADE + 4 CASES D'ACCESSOIRES)
    // =========================================================================
    function renderShop() {
      const nav = document.getElementById('bottom-nav');
      if (nav) nav.classList.remove('hidden');

      const main = document.getElementById('main-content');
      if (!main) return;

      const era = getCurrentEra();
      const stageInfo = getStageInfoFromXp(state.xp);
      const eraLabel = `Collection ${stageInfo.current.label}`;

      const filteredItems = SHOP_ITEMS.filter((item) => {
        if (item.category !== shopCategory) return false;
        if (item.era === 'all') return true;
        return item.era === era;
      });

      const equippedCount = state.equippedSlots.filter(Boolean).length;

      main.innerHTML = `
        <div class="p-4 space-y-4">
          <div class="flex items-center justify-between">
            <div>
              <h2 class="text-lg font-extrabold text-white">Boutique</h2>
              <p class="text-[11px] text-slate-400">${eraLabel}</p>
            </div>
            <div class="px-3 py-1.5 rounded-full bg-amber-500/15 border border-amber-500/30 text-amber-300 text-xs font-extrabold">
              🪙 ${state.coins}
            </div>
          </div>

          <div class="grid grid-cols-3 gap-2 bg-[#151B26] p-1.5 rounded-2xl border border-[#232D3F]">
            <button onclick="setShopCategory('accessory')" class="py-2 rounded-xl text-xs font-bold transition ${shopCategory === 'accessory' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white'}">
              🧸 Accessoires
            </button>
            <button onclick="setShopCategory('habitat')" class="py-2 rounded-xl text-xs font-bold transition ${shopCategory === 'habitat' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white'}">
              🏡 Habitats
            </button>
            <button onclick="setShopCategory('care')" class="py-2 rounded-xl text-xs font-bold transition ${shopCategory === 'care' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white'}">
              🍼 Friandises
            </button>
          </div>

          ${shopCategory === 'accessory' ? `
            <div class="px-3 py-2 rounded-2xl bg-blue-500/10 border border-blue-500/25 flex items-center justify-between text-xs">
              <span class="text-blue-200 font-medium">Cases occupées autour de ${state.petName} :</span>
              <span class="font-extrabold text-white">${equippedCount} / 4</span>
            </div>
          ` : ''}

          <div class="space-y-2.5">
            ${filteredItems.map((item) => {
              const isOwned = state.ownedItems.includes(item.id);
              const isEquippedSlot = shopCategory === 'accessory' && state.equippedSlots.includes(item.id);
              const isEquippedHab = shopCategory === 'habitat' && state.equippedHabitat === item.id;
              const reqStageIdx = typeof item.unlockStage === 'number' ? item.unlockStage : 0;
              const isLocked = shopCategory === 'habitat' && stageInfo.index < reqStageIdx;
              const reqStageLabel = EVOLUTION_STAGES[reqStageIdx] ? EVOLUTION_STAGES[reqStageIdx].label : '';

              let actionBtn = '';
              if (isLocked) {
                actionBtn = `
                  <span class="px-3 py-2 rounded-xl bg-slate-900/90 border border-white/10 text-slate-400 text-[11px] font-bold inline-flex items-center gap-1">
                    🔒 Stade ${reqStageLabel}
                  </span>
                `;
              } else if (shopCategory === 'care') {
                actionBtn = `
                  <button onclick="buyOrUseItem('${item.id}')" class="px-3.5 py-2 rounded-xl bg-amber-500/20 hover:bg-amber-500/30 border border-amber-400/40 text-amber-200 text-xs font-bold transition active:scale-95">
                    Donner · ${item.price} 🪙
                  </button>
                `;
              } else if (isEquippedSlot || isEquippedHab) {
                actionBtn = `
                  <button onclick="buyOrUseItem('${item.id}')" class="px-3.5 py-2 rounded-xl bg-emerald-500/20 border border-emerald-400/40 text-emerald-200 text-xs font-bold">
                    ✓ Placé
                  </button>
                `;
              } else if (isOwned) {
                actionBtn = `
                  <button onclick="buyOrUseItem('${item.id}')" class="px-3.5 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold transition">
                    Installer
                  </button>
                `;
              } else {
                actionBtn = `
                  <button onclick="buyOrUseItem('${item.id}')" class="px-3.5 py-2 rounded-xl bg-[#1E2634] hover:bg-blue-600 border border-white/10 text-white text-xs font-bold transition active:scale-95">
                    Acheter · ${item.price} 🪙
                  </button>
                `;
              }

              return `
                <div class="bg-[#151B26] border border-[#232D3F] rounded-2xl p-3.5 flex items-center justify-between gap-3 ${isLocked ? 'opacity-65' : ''}">
                  <div class="flex items-center gap-3 min-w-0">
                    <div class="w-12 h-12 rounded-2xl bg-[#0D1117] border border-white/5 flex items-center justify-center text-2xl shrink-0">
                      ${isLocked ? '🔒' : item.icon}
                    </div>
                    <div class="min-w-0">
                      <h3 class="text-sm font-bold text-white truncate">${item.name}</h3>
                      <p class="text-[11px] text-slate-400 line-clamp-2">${item.desc}</p>
                    </div>
                  </div>
                  <div class="shrink-0">${actionBtn}</div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function setShopCategory(cat) {
      sfxClick();
      shopCategory = cat;
      renderShop();
    }

    function buyOrUseItem(itemId) {
      const item = SHOP_ITEMS.find((i) => i.id === itemId);
      if (!item) return;

      const stageInfo = getStageInfoFromXp(state.xp);
      if (item.category === 'habitat' && typeof item.unlockStage === 'number' && stageInfo.index < item.unlockStage) {
        const reqLabel = EVOLUTION_STAGES[item.unlockStage]?.label || '';
        showToast(`🔒 Débloqué quand ${state.petName} atteindra le stade ${reqLabel} !`, 'warning');
        return;
      }

      if (item.category === 'care') {
        if (state.coins < item.price) {
          showToast(`Il te manque ${item.price - state.coins} 🪙 !`, 'warning');
          return;
        }
        sfxCoin();
        state.coins -= item.price;
        state.energy = Math.min(100, state.energy + (item.effectEnergy || 15));
        state.lastActiveAt = Date.now();
        grantXp(item.effectXp || 10);
        saveState();

        eatingPreviewItem = item;
        showToast(`${item.icon} ${state.petName} adore : ${item.name} ! (+${item.effectEnergy}% énergie)`, 'success');
        switchTab('sanctuary');
        spawnJoyParticles();
        setTimeout(() => {
          eatingPreviewItem = null;
          if (currentTab === 'sanctuary') renderSanctuary();
        }, 1700);
        return;
      }

      if (!state.ownedItems.includes(item.id)) {
        if (state.coins < item.price) {
          showToast(`Il te manque ${item.price - state.coins} 🪙 !`, 'warning');
          return;
        }
        state.coins -= item.price;
        state.ownedItems.push(item.id);
        sfxCoin();
      } else {
        sfxClick();
      }

      if (item.category === 'habitat') {
        state.equippedHabitat = item.id;
        state.lastActiveAt = Date.now();
        saveState();
        showToast(`🏡 Habitat installé : ${item.name}`, 'success');
        switchTab('sanctuary');
        return;
      }

      if (item.category === 'accessory') {
        const existingIdx = state.equippedSlots.indexOf(item.id);
        if (existingIdx !== -1) {
          state.equippedSlots[existingIdx] = null;
          saveState();
          showToast(`${item.name} rangé.`, 'info');
          renderShop();
          return;
        }

        const emptyIdx = state.equippedSlots.indexOf(null);
        if (emptyIdx !== -1) {
          state.equippedSlots[emptyIdx] = item.id;
        } else {
          state.equippedSlots.shift();
          state.equippedSlots.push(item.id);
        }
        state.lastActiveAt = Date.now();
        saveState();
        showToast(`${item.icon} ${item.name} ajouté à côté de ${state.petName} !`, 'success');
        renderShop();
      }
    }

    // =========================================================================
    // 10. MENU DÉMO (MASQUÉ), CHANGEMENT D'ANIMAL & NAVIGATION GLOBALE
    // =========================================================================
    let secretDemoTapCount = 0;
    let secretDemoTapTimer = null;
    let pendingSwitchSpecies = null;

    function handleSecretDemoTap() {
      secretDemoTapCount += 1;
      clearTimeout(secretDemoTapTimer);
      if (secretDemoTapCount >= 5) {
        secretDemoTapCount = 0;
        openDemoModal();
        return;
      }
      secretDemoTapTimer = setTimeout(() => {
        secretDemoTapCount = 0;
      }, 1400);
    }

    function openDemoModal() {
      sfxClick();
      openModal(`
        <div class="flex items-center justify-between">
          <h3 class="text-base font-extrabold text-white">⚙️ Outils Démo & Test</h3>
          <button onclick="closeModal()" class="text-slate-400 hover:text-white text-sm font-bold">✕</button>
        </div>
        <p class="text-xs text-slate-400">Teste rapidement l'évolution, les achats et la baisse d'énergie après 24h.</p>
        <div class="space-y-2">
          <button onclick="demoAddCoins()" class="w-full py-2.5 px-3 rounded-xl bg-amber-500/15 hover:bg-amber-500/25 border border-amber-500/30 text-amber-200 text-xs font-bold text-left">
            🪙 Ajouter +100 pièces
          </button>
          <button onclick="demoAddXp()" class="w-full py-2.5 px-3 rounded-xl bg-blue-500/15 hover:bg-blue-500/25 border border-blue-500/30 text-blue-200 text-xs font-bold text-left">
            🌱 Ajouter +900 XP (faire grandir)
          </button>
          <button onclick="demoSimulate48h()" class="w-full py-2.5 px-3 rounded-xl bg-purple-500/15 hover:bg-purple-500/25 border border-purple-500/30 text-purple-200 text-xs font-bold text-left">
            😴 Simuler 48h sans visite (-20% énergie)
          </button>
          <button onclick="demoResetAll()" class="w-full py-2.5 px-3 rounded-xl bg-rose-500/15 hover:bg-rose-500/25 border border-rose-500/30 text-rose-200 text-xs font-bold text-left">
            🔄 Réinitialiser la partie
          </button>
        </div>
      `);
    }

    function demoAddCoins() {
      sfxCoin();
      state.coins += 100;
      saveState();
      closeModal();
      showToast('+100 pièces ajoutées !', 'success');
      renderCurrentView();
    }

    function demoAddXp() {
      sfxVictory();
      grantXp(900);
      saveState();
      closeModal();
      renderCurrentView();
    }

    function demoSimulate48h() {
      state.lastActiveAt = Date.now() - (2 * DAY_MS + 1000);
      applyInactivityDecay(false);
      closeModal();
      renderCurrentView();
    }

    function demoResetAll() {
      stopChallengeTimer();
      activeChallenge = null;
      state = getDefaultState();
      saveState();
      closeModal();
      showToast('Partie réinitialisée.', 'info');
      renderOnboarding();
    }

    function openResetPetModal() {
      sfxClick();
      pendingSwitchSpecies = state.species || 'loutre';
      renderSwitchPetPickerModal();
    }

    function renderSwitchPetPickerModal() {
      const speciesList = Object.values(SPECIES_DATA);
      const chosenSpec = SPECIES_DATA[pendingSwitchSpecies] || SPECIES_DATA.loutre;

      openModal(`
        <div class="flex items-center justify-between">
          <h3 class="text-base font-extrabold text-white">🔄 Changer d'animal</h3>
          <button onclick="closeModal()" class="text-slate-400 hover:text-white text-sm font-bold">✕</button>
        </div>
        <p class="text-xs text-slate-300">
          Choisis l'animal souhaité, puis décide si tu veux garder ta progression actuelle ou tout recommencer à zéro.
        </p>

        <div class="grid grid-cols-4 gap-1.5 max-h-36 overflow-y-auto pr-0.5">
          ${speciesList.map((sp) => {
            const isSel = sp.id === pendingSwitchSpecies;
            return `
              <button onclick="selectSwitchSpecies('${sp.id}')" class="p-1.5 rounded-xl border flex flex-col items-center gap-0.5 transition ${isSel ? 'bg-blue-500/20 border-blue-400 text-white' : 'bg-[#0D1117] border-[#232D3F] text-slate-400 hover:border-slate-600'}">
                <span class="text-xl">${sp.emoji}</span>
                <span class="text-[10px] font-semibold truncate w-full text-center">${sp.name}</span>
              </button>
            `;
          }).join('')}
        </div>

        <div class="space-y-1">
          <label class="block text-[11px] font-semibold text-slate-300">Prénom (optionnel, par défaut : ${chosenSpec.defaultPetName}) :</label>
          <input
            id="switch-pet-name-input"
            type="text"
            maxlength="16"
            placeholder="${chosenSpec.defaultPetName}"
            class="w-full px-3 py-2 rounded-xl bg-[#0D1117] border border-[#2A3548] text-white text-xs font-semibold focus:outline-none focus:border-blue-500"
          />
        </div>

        <div class="space-y-2 pt-1">
          <button onclick="applySwitchPet(true)" class="w-full py-2.5 px-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold transition">
            ✨ Changer d'animal en gardant la progression
          </button>
          <button onclick="applySwitchPet(false)" class="w-full py-2.5 px-3 rounded-xl bg-rose-600/90 hover:bg-rose-500 text-white text-xs font-bold transition">
            🔄 Tout recommencer à zéro (perte de progression)
          </button>
        </div>
      `);
    }

    function selectSwitchSpecies(speciesId) {
      sfxClick();
      const input = document.getElementById('switch-pet-name-input');
      const typedVal = input ? input.value : '';
      pendingSwitchSpecies = speciesId;
      renderSwitchPetPickerModal();
      const nextInput = document.getElementById('switch-pet-name-input');
      if (nextInput && typedVal) nextInput.value = typedVal;
    }

    function applySwitchPet(keepProgress) {
      const spec = SPECIES_DATA[pendingSwitchSpecies] || SPECIES_DATA.loutre;
      const input = document.getElementById('switch-pet-name-input');
      const customName = input && input.value.trim() ? input.value.trim().slice(0, 16) : '';

      stopChallengeTimer();
      activeChallenge = null;

      if (keepProgress) {
        state.species = spec.id;
        state.petName = customName || spec.defaultPetName;
        state.lastActiveAt = Date.now();
        saveState();
        closeModal();
        sfxVictory();
        showToast(`✨ ${state.petName} (${spec.name}) prend la relève avec ta progression !`, 'success');
        switchTab('sanctuary');
        return;
      }

      state = {
        ...getDefaultState(),
        adopted: true,
        species: spec.id,
        petName: customName || spec.defaultPetName,
        lastActiveAt: Date.now()
      };
      saveState();
      closeModal();
      sfxVictory();
      showToast(`🔄 Nouvelle partie lancée avec ${state.petName} !`, 'info');
      switchTab('sanctuary');
    }

    // Ouvre la modale permettant de renommer l'animal sans réinitialiser sa progression
    function openRenamePetModal() {
      sfxClick();
      const safeName = String(state.petName || '').replace(/"/g, '"');
      openModal(`
        <div class="flex items-center justify-between">
          <h3 class="text-base font-extrabold text-white">✏️ Nouveau prénom</h3>
          <button onclick="closeModal()" class="text-slate-400 hover:text-white text-sm font-bold">✕</button>
        </div>
        <p class="text-xs text-slate-300">
          Choisis un nouveau prénom pour ton compagnon : ses pièces, son XP et ses objets restent conservés.
        </p>
        <input
          id="rename-pet-input"
          type="text"
          maxlength="16"
          value="${safeName}"
          placeholder="Nouveau prénom..."
          onkeydown="if (event.key === 'Enter') saveRenamedPet()"
          class="w-full px-4 py-3 rounded-2xl bg-[#0D1117] border border-[#2A3548] text-white text-sm font-semibold focus:outline-none focus:border-blue-500"
        />
        <div class="grid grid-cols-2 gap-2.5 pt-1">
          <button onclick="closeModal()" class="py-2.5 px-3 rounded-xl bg-[#1E2634] hover:bg-[#283346] text-slate-200 text-xs font-bold transition">
            Annuler
          </button>
          <button onclick="saveRenamedPet()" class="py-2.5 px-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold transition">
            Enregistrer
          </button>
        </div>
      `);

      setTimeout(() => {
        const input = document.getElementById('rename-pet-input');
        if (input) {
          input.focus();
          input.select();
        }
      }, 30);
    }

    // Enregistre le nouveau prénom sans modifier les autres statistiques de la partie
    function saveRenamedPet() {
      const input = document.getElementById('rename-pet-input');
      const spec = SPECIES_DATA[state.species] || SPECIES_DATA.loutre;
      const cleaned = input && input.value ? input.value.trim().slice(0, 16) : '';
      const nextName = cleaned || state.petName || spec.defaultPetName;

      state.petName = nextName;
      state.lastActiveAt = Date.now();
      saveState();
      sfxPet();
      closeModal();
      showToast(`✨ Ton compagnon s'appelle maintenant ${nextName} !`, 'success');
      renderCurrentView();
    }

    function switchTab(tabName) {
      sfxClick();
      currentTab = tabName;

      document.querySelectorAll('.nav-btn').forEach((btn) => {
        btn.classList.remove('text-blue-400');
        btn.classList.add('text-slate-400');
      });
      const activeBtn = document.getElementById(`nav-${tabName}`);
      if (activeBtn) {
        activeBtn.classList.remove('text-slate-400');
        activeBtn.classList.add('text-blue-400');
      }

      renderCurrentView();
    }

    function renderCurrentView() {
      if (!state.adopted) {
        renderOnboarding();
        return;
      }
      if (currentTab === 'sanctuary') renderSanctuary();
      else if (currentTab === 'challenges') renderChallenges();
      else if (currentTab === 'shop') renderShop();
    }

    // Enregistrement du Service Worker PWA pour emmanuelleede.github.io/rangement-quest/
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('https://emmanuelleede.github.io/rangement-quest/sw.js', {
          scope: '/rangement-quest/'
        }).catch(() => {});
      });
    }

    // Initialisation au chargement
    window.addEventListener('DOMContentLoaded', () => {
      updateSoundIcon();
      applyInactivityDecay(false);
      renderCurrentView();
    });
  </script>
</body>

    // 1. MOTEUR SONORE (WEB AUDIO API)
    // =========================================================================
    let soundEnabled = true;
    let audioCtx = null;

    function getAudioContext() {
      try {
        if (!audioCtx && (window.AudioContext || window.webkitAudioContext)) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          audioCtx = new Ctx();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume().catch(() => {});
        }
      } catch (e) {}
      return audioCtx;
    }

    function playTone(freq, duration = 0.12, type = 'sine', gainVal = 0.08, delay = 0) {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime + delay);
        gain.gain.setValueAtTime(gainVal, ctx.currentTime + delay);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime + delay);
        osc.stop(ctx.currentTime + delay + duration);
      } catch (e) {}
    }

    function updateSoundIcon() {
      const onIcon = document.getElementById('icon-sound-on');
      const offIcon = document.getElementById('icon-sound-off');
      if (!onIcon || !offIcon) return;
      if (soundEnabled) {
        onIcon.classList.remove('hidden');
        offIcon.classList.add('hidden');
      } else {
        onIcon.classList.add('hidden');
        offIcon.classList.remove('hidden');
      }
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      updateSoundIcon();
      if (soundEnabled) sfxClick();
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return getDefaultState();
        const parsed = JSON.parse(raw);
        const merged = {
          ...getDefaultState(),
          ...parsed,
          challengeRecords: parsed && typeof parsed.challengeRecords === 'object' && parsed.challengeRecords !== null
            ? parsed.challengeRecords
            : {},
          equippedSlots: Array.isArray(parsed.equippedSlots) && parsed.equippedSlots.length === 4
            ? parsed.equippedSlots
            : [null, null, null, null]
        };
        if (!HABITAT_THEMES[merged.equippedHabitat]) {
          merged.equippedHabitat = 'none';
        }
        return merged;
      } catch (e) {
        return getDefaultState();
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
    }

    let state = loadState();

    function applyInactivityDecay(silent = false) {
      if (!state.adopted) {
        state.lastActiveAt = Date.now();
        saveState();
        return;
      }
      const now = Date.now();
      const last = state.lastActiveAt || now;
      const elapsed = now - last;
      const daysPassed = Math.floor(elapsed / DAY_MS);

      if (daysPassed >= 1) {
        const loss = daysPassed * 10;
        const oldEnergy = state.energy;
        state.energy = Math.max(10, state.energy - loss);
        state.lastActiveAt = last + daysPassed * DAY_MS;
        saveState();
        if (!silent && state.energy < oldEnergy) {
          showToast(`😴 ${daysPassed} jour(s) sans visite : énergie -${oldEnergy - state.energy}%`, 'info');
        }
      } else {
        state.lastActiveAt = now;
        saveState();
      }
    }

    // =========================================================================

    // =========================================================================
    function getStageIndexFromXp(xp) {
      let idx = 0;
      for (let i = 0; i < EVOLUTION_STAGES.length; i++) {
        if (xp >= EVOLUTION_STAGES[i].minXp) {
          idx = i;
        }
      }
      return idx;
    }

    function getStageInfoFromXp(xp) {
      const idx = getStageIndexFromXp(xp);
      const current = EVOLUTION_STAGES[idx] || EVOLUTION_STAGES[0];
      const next = EVOLUTION_STAGES[idx + 1] || null;
      return {
        index: idx,
        current,
        next,
        isMax: !next
      };
    }

    function getCurrentEra() {
      return getStageInfoFromXp(state.xp).current.era;
    }

    function grantXp(amount) {
      const prevStage = getStageInfoFromXp(state.xp);
      state.xp += amount;
      const newStage = getStageInfoFromXp(state.xp);

      if (newStage.index > prevStage.index) {
        state.equippedSlots = [null, null, null, null];
        state.lastEra = newStage.current.era;
        showToast(`🎉 ${state.petName} devient ${newStage.current.label} ! Nouveaux objets en boutique !`, 'success');
      }
    }

    function getLocalPetImageCandidates(speciesId, xp = 0) {
      const cfg = SPECIES_VISUAL_CONFIG[speciesId] || SPECIES_VISUAL_CONFIG.loutre;
      const stageIndex = getStageIndexFromXp(xp);
      const candidates = [];

      if (Array.isArray(cfg.localStageImages) && cfg.localStageImages[stageIndex]) {
        candidates.push(cfg.localStageImages[stageIndex]);
      }
      if (Array.isArray(cfg.localStageImages)) {
        cfg.localStageImages.forEach((imgPath) => {
          if (imgPath && !candidates.includes(imgPath)) {
            candidates.push(imgPath);
          }
        });
      }
      if (cfg.localFallback && !candidates.includes(cfg.localFallback)) {
        candidates.push(cfg.localFallback);
      }
      return candidates;
    }

    function renderLocalImageWithFallback(candidates, altText, extraClasses, styleAttr, fallbackHtml) {
      const cleanList = (Array.isArray(candidates) ? candidates : [candidates]).filter(Boolean);
      if (!cleanList.length) {
        return fallbackHtml;
      }

      const encodedList = encodeURIComponent(JSON.stringify(cleanList));
      const firstSrc = cleanList[0];

      return `
        <img
          src="${firstSrc}"
          alt="${altText}"
          data-candidates="${encodedList}"
          data-candidate-index="0"
          class="${extraClasses || ''}"
          style="${styleAttr || ''}"
          onerror="handleLocalImageError(this)"
        />
        <div class="local-img-fallback hidden w-full h-full">${fallbackHtml}</div>
      `;
    }

    window.handleLocalImageError = function (imgEl) {
      try {
        const rawList = imgEl.getAttribute('data-candidates');
        const currentIdx = parseInt(imgEl.getAttribute('data-candidate-index') || '0', 10);
        const candidates = rawList ? JSON.parse(decodeURIComponent(rawList)) : [];
        const nextIdx = currentIdx + 1;

        if (nextIdx < candidates.length) {
          imgEl.setAttribute('data-candidate-index', String(nextIdx));
          imgEl.src = candidates[nextIdx];
          return;
        }
      } catch (e) {}

      imgEl.classList.add('hidden');
      const fallbackEl = imgEl.parentElement && imgEl.parentElement.querySelector('.local-img-fallback');
      if (fallbackEl) {
        fallbackEl.classList.remove('hidden');
      }
    };

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const colorMap = {
        success: 'bg-emerald-950/95 border-emerald-500/40 text-emerald-200',
        warning: 'bg-amber-950/95 border-amber-500/40 text-amber-200',
        info: 'bg-[#151B26]/95 border-blue-500/40 text-slate-100'
      };

      const toast = document.createElement('div');
      toast.className = `px-4 py-2.5 rounded-2xl border backdrop-blur-md text-xs font-semibold shadow-xl transition-all duration-300 text-center ${colorMap[type] || colorMap.info}`;
      toast.textContent = message;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-8px)';
        setTimeout(() => toast.remove(), 300);
      }, 2600);
    }

    function openModal(innerHtml) {
      const overlay = document.getElementById('modal-overlay');
      const box = document.getElementById('modal-box');
      if (!overlay || !box) return;
      box.innerHTML = innerHtml;
      overlay.classList.remove('hidden');
      overlay.classList.add('flex');
    }

    function closeModal() {
      const overlay = document.getElementById('modal-overlay');

        p.className = 'floating-particle absolute z-30 text-xl';
        p.style.left = `${36 + i * 9}%`;
        p.style.top = `${42 + (i % 2) * 8}%`;
        p.style.animationDelay = `${i * 0.08}s`;
        p.textContent = sym;
        card.appendChild(p);
        setTimeout(() => p.remove(), 1100);
      });

    function quickFeed() {
      const era = getCurrentEra();
      const quickFoodByEra = {

        adult: { id: 'adu_peach', name: 'Pêche Solaire', icon: '🍑', price: 25, effectEnergy: 20, effectXp: 12 }

      if (state.coins < food.price) {
        showToast(`Pas assez de pièces (${food.price} 🪙 requis).`, 'warning');
        return;

      sfxCoin();
      state.coins -= food.price;
      state.energy = Math.min(100, state.energy + food.effectEnergy);
      state.lastActiveAt = Date.now();
      grantXp(food.effectXp);
      saveState();

      eatingPreviewItem = food;
      renderSanctuary();
      spawnJoyParticles();
      setTimeout(() => {

        if (currentTab === 'sanctuary') renderSanctuary();
